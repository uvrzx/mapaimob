let lastFilters = defaultFilters();

window.addEventListener('filters-applied', (e) => {
  $('resultCount').textContent = e.detail.filtered.length;
  const filteredIds = new Set(e.detail.filtered.map(p => p.id));
  Object.entries(markersById).forEach(([id, marker]) => {
    const shouldShow = filteredIds.has(id);
    const isShown = markersLayer.hasLayer(marker);
    if (shouldShow && !isShown) marker.addTo(markersLayer);
    if (!shouldShow && isShown) markersLayer.removeLayer(marker);
  });
  lastFilters = e.detail.filters;
  if (appState.mapMode === 'condominio') renderCondoMarkers();
});

/* === SECTION: LIST === */
function renderList(properties) {
  const wrap = $('listItems');
  wrap.innerHTML = properties.map(p => {
    const priceLabel = priceLabelFor(p);
    const addr = p.address || {};
    const statusColor = STATUS_COLORS[p.status] || '#8b9bab';
    const statusTextColor = STATUS_TEXT_COLORS[p.status] || '#5a6270';
    const photoUrl = p.photos && p.photos.length ? URL.createObjectURL(p.photos[0]) : null;
    const specs = [
      p.rooms ? `<span>${ICONS.bed}${p.rooms}</span>` : '',
      p.bathrooms ? `<span>${ICONS.bath}${p.bathrooms}</span>` : '',
      p.constructedArea ? `<span>${ICONS.area}${p.constructedArea}m²</span>` : ''
    ].join('');
    return `<div class="list-item" data-id="${p.id}">
      ${photoUrl ? `<img src="${photoUrl}" class="list-item-photo" onclick="event.stopPropagation(); openPropertyDetail('${p.id}')">` : `<div class="list-item-photo list-item-photo-empty" onclick="event.stopPropagation(); openPropertyDetail('${p.id}')">${TYPE_ICONS[p.unitType] || ICONS.house}</div>`}
      <div class="list-item-body">
        <div class="list-item-top">
          <strong onclick="event.stopPropagation(); openPropertyDetail('${p.id}')" style="cursor:pointer;">${priceLabel}</strong>
          <span class="list-item-status" style="background:${statusColor}22;color:${statusTextColor};">${STATUS_LABELS[p.status] || p.status}</span>
        </div>
        <div class="list-item-addr">${UNIT_TYPE_LABELS[p.unitType] || p.unitType} · ${addr.neighborhood || ''}</div>
        ${specs ? `<div class="list-item-specs">${specs}</div>` : ''}
        ${p.isLaunch ? `<div class="unit-stepper"><button type="button" onclick="event.stopPropagation(); adjustAvailableUnits('${p.id}', -1)">−</button><span>${p.availableUnits} de ${p.totalUnits}</span><button type="button" onclick="event.stopPropagation(); adjustAvailableUnits('${p.id}', 1)">+</button></div>` : ''}
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const marker = markersById[id];
      if (!marker) return;
      map.flyTo(marker.getLatLng(), 16, { duration: 0.6 });
      map.once('moveend', () => marker.openPopup());
      if (narrowMq.matches) setListHidden(true);
    });
  });
}

window.addEventListener('filters-applied', (e) => renderList(e.detail.filtered));

/* === SECTION: BACKUP === */
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function base64ToBlob(dataUrl) {
  return fetch(dataUrl).then(r => r.blob());
}

async function exportBackup() {
  const properties = await dbGetAll('properties');
  const condos = await dbGetAll('condos');
  const propertiesOut = [];
  for (const p of properties) {
    const photos = [];
    for (const blob of (p.photos || [])) photos.push(await blobToBase64(blob));
    propertiesOut.push({ ...p, photos });
  }
  const payload = { version: 1, exportedAt: new Date().toISOString(), properties: propertiesOut, condos };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mapa-imoveis-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function importBackup(file) {
  let payload;
  try {
    const text = await file.text();
    payload = JSON.parse(text);
  } catch (err) {
    console.error(err);
    alert('Arquivo de backup inválido ou corrompido.');
    return;
  }
  if (!payload || !Array.isArray(payload.properties) || !Array.isArray(payload.condos)) {
    alert('Arquivo de backup em formato inesperado (faltam properties/condos).');
    return;
  }
  try {
    for (const condo of payload.condos) await dbPut('condos', condo);
    for (const p of payload.properties) {
      const photos = [];
      for (const dataUrl of (p.photos || [])) photos.push(await base64ToBlob(dataUrl));
      await dbPut('properties', { ...p, photos });
    }
    await loadAllProperties();
    alert('Importação concluída.');
  } catch (err) {
    console.error(err);
    alert('Erro ao importar backup: parte dos dados pode não ter sido restaurada. Veja o console.');
  }
}

window.addEventListener('DOMContentLoaded', () => {
  $('btnExport').addEventListener('click', exportBackup);
  $('btnImport').addEventListener('click', () => $('importFileInput').click());
  $('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importBackup(file);
    e.target.value = '';
  });
});

/* === SECTION: LAYOUT === */
// <900px: sidebar e lista viram gavetas sobre o mapa (ver @media no CSS)
const narrowMq = window.matchMedia('(max-width: 899px)');

function setDrawer(open) {
  $('sidebar').classList.toggle('open', open);
  $('drawerBackdrop').classList.toggle('show', open);
}

function setListHidden(hidden) {
  $('listPanel').classList.toggle('hidden', hidden);
  $('btnToggleList').textContent = hidden ? 'Mostrar lista' : 'Ocultar lista';
  map.invalidateSize();
}

window.addEventListener('DOMContentLoaded', () => {
  setListHidden(true);
  narrowMq.addEventListener('change', () => {
    setDrawer(false);
    if (narrowMq.matches) setListHidden(true);
  });
  $('drawerBackdrop').addEventListener('click', () => setDrawer(false));
  $('btnDrawerClose').addEventListener('click', () => setDrawer(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setDrawer(false); });

  const handle = $('sidebarResizeHandle');
  const sidebar = $('sidebar');
  let dragging = false;
  handle.addEventListener('mousedown', (e) => {
    dragging = true;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const newWidth = Math.min(600, Math.max(260, e.clientX));
    sidebar.style.width = newWidth + 'px';
    if (map) map.invalidateSize();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
  });

  $('btnCollapseSidebar').addEventListener('click', () => {
    const collapsed = $('sidebar').classList.toggle('collapsed');
    $('btnCollapseSidebar').classList.toggle('collapsed', collapsed);
    $('btnCollapseSidebar').title = collapsed ? 'Mostrar filtros' : 'Ocultar filtros';
    setTimeout(() => map.invalidateSize(), 210);
  });

  $('btnToggleList').addEventListener('click', () => setListHidden(!$('listPanel').classList.contains('hidden')));

  $('mapModeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn || appState.mapMode === btn.dataset.mode) return;
    appState.mapMode = btn.dataset.mode;
    $('mapModeToggle').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    if (appState.mapMode === 'condominio') {
      markersLayer.remove();
      renderCondoMarkers();
      condoMarkersLayer.addTo(map);
    } else {
      condoMarkersLayer.remove();
      markersLayer.addTo(map);
    }
  });

  $('btnHudFilter').addEventListener('click', () => {
    if (narrowMq.matches) setDrawer(!$('sidebar').classList.contains('open'));
    else $('btnCollapseSidebar').click();
  });

  $('tabDashboard').addEventListener('click', () => {
    $('dashboardView').style.display = '';
    $('mapView').style.display = 'none';
    $('financingView').style.display = 'none';
    $('detailView').style.display = 'none';
    $('tabDashboard').classList.add('active');
    $('tabMap').classList.remove('active');
    $('tabFinancing').classList.remove('active');
  });
  $('tabMap').addEventListener('click', () => {
    $('dashboardView').style.display = 'none';
    $('mapView').style.display = 'flex';
    $('financingView').style.display = 'none';
    $('detailView').style.display = 'none';
    $('tabMap').classList.add('active');
    $('tabDashboard').classList.remove('active');
    $('tabFinancing').classList.remove('active');
    map.invalidateSize();
  });
  $('tabFinancing').addEventListener('click', () => {
    showFinancingTab();
    if (!$('financingFrame').src) $('financingFrame').src = 'financiamento.html';
  });
  $('btnDetailBack').addEventListener('click', closeDetailView);
});
</script>
