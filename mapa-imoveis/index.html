<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Imóveis — Uso Interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1/dist/leaflet.css">
<style>
  :root {
    --bg: #f5f6fa; --panel: #ffffff; --panel-2: #f0f1f6; --line: #e6e8f0;
    --text: #14161f; --muted: #8a8f9c; --accent: #4b5fee; --accent-tint: rgba(75,95,238,.12);
    --ok-bg: #e7f9ee; --ok-fg: #1aa34a; --ok-line: #b7ecc8;
    --warn-bg: #fdeaea; --warn-fg: #e5484d; --warn-line: #f5c2c2;
    --shadow-soft: 0 8px 24px rgba(20,24,50,.06);
    --radius: 16px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  button { -webkit-tap-highlight-color: transparent; user-select: none; transition: transform .1s ease; }
  button:active { transform: scale(.94); }
  input:focus-visible, select:focus-visible, textarea:focus-visible, .quick-search:focus {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  body {
    font-family: var(--sans); background: var(--panel); color: var(--text); font-size: 15px; line-height: 1.4;
    display: flex;
  }
  .shell {
    width: 100vw; height: 100vh; background: var(--panel);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .quick-search {
    flex: 1; max-width: 380px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 14px; border-radius: 20px; font-size: 13px;
  }
  header button {
    background: var(--accent); color: #fff; border: 0; padding: 8px 16px;
    border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 13px;
  }
  header button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  header button.active { background: var(--ok-fg); color: #fff; }
  .view-tabs { display: flex; gap: 2px; background: var(--panel-2); border-radius: 20px; padding: 3px; }
  .view-tab { background: transparent; border: 0; color: var(--muted); padding: 7px 16px; border-radius: 16px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .view-tab.active { background: var(--accent); color: #fff; }
  #financingView { flex: 1; min-height: 0; display: none; }
  #financingFrame { width: 100%; height: 100%; border: 0; display: block; }
  #detailView { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 28px 32px; }
  #detailView > button, .detail-main button { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  #detailView > button.ghost, .detail-main button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  #btnDetailBack { margin-bottom: 20px; }
  .detail-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: start; }
  .detail-title { font-size: 24px; margin: 0 0 4px; }
  .detail-address { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .detail-price-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .detail-price { font-size: 22px; font-weight: 700; }
  .detail-specs { display: flex; gap: 20px; margin-bottom: 20px; font-size: 14px; color: var(--text); flex-wrap: wrap; }
  .detail-specs span { display: flex; align-items: center; gap: 6px; fill: var(--muted); }
  .detail-section { margin-top: 24px; }
  .detail-section h3 { font-size: 15px; margin: 0 0 10px; }
  #detailDescText { white-space: pre-line; }
  .detail-hero { width: 100%; height: 320px; object-fit: cover; border-radius: 16px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; fill: var(--muted); }
  .detail-thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .detail-thumbs img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; }
  .detail-amenities { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .detail-amenities span { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); fill: none; stroke: var(--accent); }
  .layout-body { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 300px; flex-shrink: 0; display: flex; flex-direction: column;
    overflow-y: auto; padding: 20px; border-right: 1px solid var(--line);
    transition: width .2s ease, padding .2s ease;
  }
  #sidebar.collapsed { width: 0; min-width: 0; padding: 20px 0; overflow: hidden; border-right: 0; }
  #sidebar.collapsed > * { opacity: 0; pointer-events: none; }
  .sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sidebar-head h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .reset-link { background: none; border: 0; color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0; }
  #sidebarResizeHandle { width: 6px; flex-shrink: 0; cursor: col-resize; background: transparent; position: relative; }
  #sidebarResizeHandle:hover, #sidebarResizeHandle.dragging { background: var(--accent); }
  #btnCollapseSidebar {
    position: absolute; top: 16px; left: -13px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5;
    transition: transform .2s ease;
  }
  #btnCollapseSidebar:hover { border-color: var(--accent); color: var(--accent); }
  #btnCollapseSidebar.collapsed { transform: rotate(180deg); }
  #contentPanel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .content-head { padding: 16px 20px 0; font-size: 13px; color: var(--muted); font-weight: 700; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .content-head button { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; cursor: pointer; }
  .content-head button:hover { border-color: var(--accent); color: var(--text); }
  #listPanel.hidden { display: none; }
  #mapWrap {
    flex: 1; min-height: 0; position: relative; isolation: isolate;
    margin: 14px 20px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  }
  #map { position: absolute; inset: 0; }
  #map.add-mode, #map.add-mode .leaflet-container { cursor: crosshair; }
  .leaflet-marker-draggable { cursor: grab !important; }
  .leaflet-marker-draggable:active, .leaflet-drag-target { cursor: grabbing !important; }
  #propertyForm {
    position: fixed; top: 0; right: 0; height: 100%; width: 380px; max-width: 100vw;
    background: var(--panel); border-left: 1px solid var(--line); z-index: 40;
    transform: translateX(100%); transition: transform .25s cubic-bezier(.16,1,.3,1);
    display: flex; flex-direction: column; padding: 18px 18px 0;
  }
  #propertyForm.open { transform: translateX(0); }
  #propertyForm h2 { font-size: 15px; margin: 0 0 14px; flex-shrink: 0; }
  #propertyFormEl { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 4px; }
  .form-section { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .form-section:last-of-type { border-bottom: 0; }
  .form-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin: 0 0 4px; }
  #propertyForm label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #propertyForm input, #propertyForm select, #propertyForm textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 8px 10px; border-radius: 8px; font-size: 14px;
  }
  #propertyForm .row { display: flex; gap: 10px; }
  #propertyForm .row > * { flex: 1; }
  #formErrors { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-fg); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-top: 10px; display: none; flex-shrink: 0; }
  #formErrors.show { display: block; }
  .btn-row { display: flex; gap: 10px; flex-shrink: 0; padding: 12px 0 18px; border-top: 1px solid var(--line); background: var(--panel); }
  #propertyForm button { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  #propertyForm button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  .btn-row button { flex: 1; }
  #filterPanel label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; text-transform:none; }
  #filterPanel select, #filterPanel input[type=text], #filterPanel input[type=number] {
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:6px 8px; border-radius:6px; font-size:13px;
  }
  #filterPanel .row { display: flex; gap: 10px; }
  #filterPanel .row > * { flex: 1; }

  /* pin */
  .property-pin { animation: pin-pop .3s cubic-bezier(.34,1.56,.64,1); transform-origin: bottom center; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); transition: transform .12s ease; }
  .property-pin:hover { transform: scale(1.12) translateY(-2px); }
  @keyframes pin-pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* popup card */
  .leaflet-popup-content-wrapper { padding: 0; border-radius: 12px; overflow: hidden; background: var(--panel); color: var(--text); box-shadow: var(--shadow-soft); }
  .leaflet-popup-content { margin: 0; width: 260px !important; }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-close-button { color: var(--muted) !important; }
  .property-popup-photo { width: 100%; height: 130px; object-fit: cover; display: block; background: var(--panel-2); }
  .property-popup-photo-empty { display: flex; align-items: center; justify-content: center; fill: var(--muted); }
  .property-popup-body { padding: 12px 14px; }
  .property-popup-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .property-popup-price { font-size: 17px; }
  .property-popup-status { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; letter-spacing: .4px; white-space: nowrap; }
  .property-popup-type { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .property-popup-addr { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.35; }
  .property-popup-specs { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--text); }
  .property-popup-specs span { display: flex; align-items: center; gap: 4px; fill: var(--muted); }
  .unit-stepper { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text); }
  .unit-stepper button { width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); cursor: pointer; font-weight: 700; line-height: 1; padding: 0; flex-shrink: 0; }
  .unit-stepper button:hover { border-color: var(--accent); color: var(--accent); }
  .property-popup-actions { display: flex; gap: 8px; margin-top: 12px; }
  .property-popup-actions button { flex: 1; padding: 7px 4px; font-size: 11px; border-radius: 7px; background: var(--accent); color: #fff; border: 0; cursor: pointer; font-weight: 700; white-space: nowrap; }
  .property-popup-actions button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }

  /* chips / segmented controls (filtros) */
  .chip-group, .stepper-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .seg-group { display: flex; background: var(--panel-2); border-radius: 8px; padding: 3px; gap: 2px; margin: 4px 0 2px; }
  .seg-group { position: relative; }
  .seg-group button {
    flex: 1; background: transparent; border: 0; color: var(--muted); padding: 7px 8px;
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: color .15s, background .2s cubic-bezier(.2,.8,.2,1);
  }
  .seg-group button.active { background: var(--accent); color: #fff; }

  /* lista de imóveis (strip horizontal de cards abaixo do mapa) */
  #listPanel { flex-shrink: 0; padding: 0 20px 18px; }
  #listItems { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; scroll-behavior: smooth; }
  .list-item {
    display: flex; flex-direction: column; width: 220px; flex-shrink: 0; scroll-snap-align: start;
    border-radius: 14px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line);
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .list-item:hover { transform: translateY(-3px); border-color: var(--accent); }
  .list-item:active { transform: translateY(-1px) scale(.97); }
  .list-item-photo { width: 100%; height: 120px; object-fit: cover; flex-shrink: 0; background: var(--panel); }
  .list-item-photo-empty { display: flex; align-items: center; justify-content: center; fill: var(--muted); }
  .list-item-body { min-width: 0; padding: 10px 12px 12px; }
  .list-item-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .list-item-top strong { font-size: 13px; }
  .list-item-status { font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 10px; white-space: nowrap; }
  .list-item-addr { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item-specs { display: flex; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--text); }
  .list-item-specs span { display: flex; align-items: center; gap: 3px; fill: var(--muted); }

  /* cartão de filtros flutuante sobre o mapa */
  #mapFilterCard {
    position: absolute; top: 14px; left: 14px; z-index: 800; width: 250px;
    background: var(--panel); border-radius: 12px; box-shadow: var(--shadow-soft);
    padding: 14px; max-height: calc(100% - 28px); overflow-y: auto;
  }
  #btnCollapseMapFilter {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2;
    transition: transform .2s ease;
  }
  #btnCollapseMapFilter:hover { border-color: var(--accent); color: var(--accent); }
  #btnCollapseMapFilter.collapsed { transform: rotate(180deg); }
  #mapFilterCard > .seg-group:first-of-type { margin-top: 26px; }
  #mapFilterCard.collapsed { width: 40px; height: 40px; padding: 0; overflow: hidden; }
  #mapFilterCard.collapsed > *:not(#btnCollapseMapFilter) { display: none; }
  #mapFilterCard label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .type-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 6px; font-size: 11px; color: var(--text); cursor: pointer; transition: all .15s; fill: var(--muted);
  }
  .type-btn:hover { border-color: var(--accent); }
  .type-btn.active { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); fill: var(--accent); font-weight: 600; }

  /* backdrop do formulário */
  #formBackdrop { position: fixed; inset: 0; background: rgba(20,24,50,.25); backdrop-filter: blur(1px); z-index: 35; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  #formBackdrop.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div class="shell" x-data="filterApp()" x-init="init()">
  <header>
    <h1>🏠 Mapa de Imóveis</h1>
    <div class="view-tabs">
      <button type="button" id="tabMap" class="view-tab active">Mapa</button>
      <button type="button" id="tabFinancing" class="view-tab">Financiamento</button>
    </div>
    <input id="quickSearch" class="quick-search" type="text" placeholder="Buscar por endereço, bairro ou apelido..." x-model="filters.query" @input="apply()">
    <button id="btnAddProperty" type="button">+ Adicionar imóvel</button>
    <button id="btnExport" class="ghost" type="button">Exportar</button>
    <button id="btnImport" class="ghost" type="button">Importar</button>
    <input id="importFileInput" type="file" accept="application/json" style="display:none">
  </header>
  <div class="layout-body" id="mapView">
  <aside id="sidebar">
    <div class="sidebar-head">
      <h2>Filtros</h2>
      <button type="button" class="reset-link" @click="reset()">Limpar</button>
    </div>
    <div id="filterPanel">
      <label>Status</label>
      <div class="chip-group">
        <template x-for="st in statusOptions" :key="st.value">
          <button type="button" class="chip" :class="{active: filters.status.includes(st.value)}" x-text="st.label"
            @click="filters.status = filters.status.includes(st.value) ? filters.status.filter(v => v !== st.value) : [...filters.status, st.value]; apply()"></button>
        </template>
      </div>

      <label>Preço mín / máx</label>
      <div class="row">
        <input type="number" x-model.number="filters.priceMin" @input="apply()" placeholder="mín">
        <input type="number" x-model.number="filters.priceMax" @input="apply()" placeholder="máx">
      </div>

      <label>Vagas mín</label>
      <div class="stepper-group">
        <button type="button" class="chip" :class="{active: filters.parkingMin===null}" @click="filters.parkingMin=null; apply()">Todas</button>
        <template x-for="n in [1,2,3,4]" :key="n">
          <button type="button" class="chip" :class="{active: filters.parkingMin===n}" @click="filters.parkingMin=n; apply()" x-text="n + (n===4?'+':'')"></button>
        </template>
      </div>

      <label>Suítes mín</label>
      <input type="number" x-model.number="filters.suitesMin" @input="apply()">

      <label>Área mín / máx (m²)</label>
      <div class="row">
        <input type="number" x-model.number="filters.areaMin" @input="apply()" placeholder="mín">
        <input type="number" x-model.number="filters.areaMax" @input="apply()" placeholder="máx">
      </div>

      <label>Mobiliado</label>
      <div class="seg-group">
        <template x-for="opt in [{v:'qualquer',l:'Qualquer'},{v:'sim',l:'Sim'},{v:'não',l:'Não'},{v:'parcial',l:'Parcial'}]" :key="opt.v">
          <button type="button" :class="{active: filters.furnished===opt.v}" @click="filters.furnished=opt.v; apply()" x-text="opt.l"></button>
        </template>
      </div>

      <label>Aceita pet</label>
      <div class="seg-group">
        <template x-for="opt in [{v:'qualquer',l:'Qualquer'},{v:'true',l:'Sim'},{v:'false',l:'Não'}]" :key="opt.v">
          <button type="button" :class="{active: filters.petsAllowed===opt.v}" @click="filters.petsAllowed=opt.v; apply()" x-text="opt.l"></button>
        </template>
      </div>

      <label>Bairro</label>
      <input type="text" x-model="filters.neighborhood" @input="apply()">

      <label>Corretor</label>
      <input type="text" x-model="filters.agentResponsible" @input="apply()">

      <label>Amenidades do condomínio</label>
      <div class="chip-group">
        <template x-for="am in amenityOptions" :key="am.value">
          <button type="button" class="chip" :class="{active: filters.amenities.includes(am.value)}" x-text="am.label"
            @click="filters.amenities = filters.amenities.includes(am.value) ? filters.amenities.filter(v => v !== am.value) : [...filters.amenities, am.value]; apply()"></button>
        </template>
      </div>
    </div>
  </aside>
  <div id="sidebarResizeHandle">
    <button type="button" id="btnCollapseSidebar" title="Ocultar filtros">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <main id="contentPanel">
    <div class="content-head">
      <span><span id="resultCount">0</span> imóveis encontrados</span>
      <button type="button" id="btnToggleList" class="ghost">Ocultar lista</button>
    </div>
    <div id="mapWrap">
    <div id="mapFilterCard">
      <button type="button" id="btnCollapseMapFilter" title="Ocultar filtros do mapa">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
      <div class="seg-group">
        <template x-for="opt in [{v:'ambos',l:'Ambos'},{v:'venda',l:'Comprar'},{v:'aluguel',l:'Alugar'}]" :key="opt.v">
          <button type="button" :class="{active: filters.dealType===opt.v}" @click="filters.dealType=opt.v; apply()" x-text="opt.l"></button>
        </template>
      </div>

      <label>Tipo de imóvel</label>
      <div class="type-grid">
        <template x-for="ut in unitTypeOptions" :key="ut.value">
          <button type="button" class="type-btn" :class="{active: filters.unitTypes.includes(ut.value)}"
            @click="filters.unitTypes = filters.unitTypes.includes(ut.value) ? filters.unitTypes.filter(v => v !== ut.value) : [...filters.unitTypes, ut.value]; apply()">
            <span x-html="typeIcons[ut.value]"></span>
            <span x-text="ut.label"></span>
          </button>

/* === SECTION: INDEXEDDB === */
const DB_NAME = 'mapaImoveisDB';
const DB_VERSION = 2;
let dbInstance = null;

function dbOpen() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    if (!window.indexedDB) return reject(new Error('IndexedDB não suportado neste navegador.'));
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('properties')) db.createObjectStore('properties', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('condos')) db.createObjectStore('condos', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('_selfcheck')) db.createObjectStore('_selfcheck', { keyPath: 'id' });
      if (e.oldVersion < 2) {
        // migração: versões antigas gravavam o registro de self-check direto em 'properties'
        e.target.transaction.objectStore('properties').delete('__selfcheck__');
      }
    };
    req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbPut(storeName, record) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(record);
    tx.oncomplete = () => resolve(record);
    tx.onerror = (e) => reject(e.target.error);
  });
}

async function dbGet(storeName, id) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbGetAll(storeName) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbDelete(storeName, id) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function formatCurrency(value) {
  if (value == null || isNaN(value)) return 'R$ 0,00';
  return 'R$ ' + Number(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function priceLabelFor(property) {
  const price = property.dealType === 'aluguel' ? property.rentPrice : property.salePrice;
  return property.dealType === 'aluguel' ? formatCurrency(price) + '/mês' : formatCurrency(price);
}

function validateProperty(property) {
  const errors = [];
  if (!property.unitType) errors.push('Tipo de imóvel é obrigatório.');
  if (!property.dealType) errors.push('Negócio (venda/aluguel) é obrigatório.');
  if (property.dealType !== 'aluguel' && !(property.salePrice > 0)) errors.push('Preço de venda é obrigatório.');
  if (property.dealType !== 'venda' && !(property.rentPrice > 0)) errors.push('Preço de aluguel é obrigatório.');
  if (!property.address || !property.address.street) errors.push('Endereço é obrigatório.');
  if (!Array.isArray(property.coordinates) || property.coordinates.length !== 2) errors.push('Coordenadas são obrigatórias (clique no mapa).');
  if (property.isLaunch && !(property.totalUnits > 0)) errors.push('Lançamento precisa de total de unidades maior que zero.');
  if (property.isLaunch && (property.availableUnits < 0 || property.availableUnits > property.totalUnits)) errors.push('Unidades disponíveis deve estar entre 0 e o total.');
  return errors;
}

function matchesFilters(property, condosById, filters) {
  if (filters.dealType !== 'ambos' && property.dealType !== 'venda_e_aluguel' && property.dealType !== filters.dealType) return false;
  if (filters.unitTypes.length && !filters.unitTypes.includes(property.unitType)) return false;
  if (filters.status.length && !filters.status.includes(property.status)) return false;
  if (filters.priceMin != null || filters.priceMax != null) {
    const inRange = (price) => price > 0 && (filters.priceMin == null || price >= filters.priceMin) && (filters.priceMax == null || price <= filters.priceMax);
    const relevantPrices = filters.dealType === 'aluguel' ? [property.rentPrice]
      : filters.dealType === 'venda' ? [property.salePrice]
      : [property.salePrice, property.rentPrice];
    if (!relevantPrices.some(inRange)) return false;
  }
  if (filters.roomsMin != null && (property.rooms || 0) < filters.roomsMin) return false;
  if (filters.suitesMin != null && (property.suites || 0) < filters.suitesMin) return false;
  if (filters.bathroomsMin != null && (property.bathrooms || 0) < filters.bathroomsMin) return false;
  if (filters.parkingMin != null && (property.parkingSpaces || 0) < filters.parkingMin) return false;
  if (filters.areaMin != null && (property.constructedArea || 0) < filters.areaMin) return false;
  if (filters.areaMax != null && (property.constructedArea || 0) > filters.areaMax) return false;
  if (filters.furnished !== 'qualquer' && property.furnished !== filters.furnished) return false;
  if (filters.petsAllowed !== 'qualquer' && String(property.petsAllowed) !== filters.petsAllowed) return false;
  if (filters.neighborhood && !(property.address.neighborhood || '').toLowerCase().includes(filters.neighborhood.toLowerCase())) return false;
  if (filters.agentResponsible && !(property.agentResponsible || '').toLowerCase().includes(filters.agentResponsible.toLowerCase())) return false;
  if (filters.query) {
    const q = filters.query.toLowerCase();
    const addr = property.address || {};
    const haystack = [property.label, addr.street, addr.neighborhood].filter(Boolean).join(' ').toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  if (filters.amenities.length) {
    const condo = property.condoId ? condosById[property.condoId] : null;
    if (!condo) return false;
    for (const amenity of filters.amenities) if (!condo[amenity]) return false;
  }
  return true;
}

  console.assert(matchesFilters(propA, {}, baseFilters) === true, 'ASSERT FAIL: matchesFilters deveria aceitar sem filtros ativos');
  console.assert(matchesFilters(propA, {}, { ...baseFilters, unitTypes: ['apartamento'] }) === false, 'ASSERT FAIL: matchesFilters deveria rejeitar tipo diferente');
  console.assert(matchesFilters(propA, {}, { ...baseFilters, priceMin: 600000 }) === false, 'ASSERT FAIL: matchesFilters deveria rejeitar preço abaixo do mínimo');
  console.assert(matchesFilters(propA, {}, { ...baseFilters, roomsMin: 2 }) === true, 'ASSERT FAIL: matchesFilters deveria aceitar quartos suficientes');

  const propRental = { ...propA, dealType: 'aluguel', salePrice: 0, rentPrice: 2500 };
  console.assert(matchesFilters(propRental, {}, { ...baseFilters, priceMin: 2000, priceMax: 3000 }) === true, 'ASSERT FAIL: matchesFilters (ambos) deveria aceitar aluguel dentro da faixa de preço via rentPrice');
  console.assert(matchesFilters(propRental, {}, { ...baseFilters, priceMin: 2000, priceMax: 3000, dealType: 'venda' }) === false, 'ASSERT FAIL: matchesFilters (venda) não deveria considerar rentPrice');
  const propAgent = { ...propA, agentResponsible: 'Ana Paula' };
  console.assert(matchesFilters(propAgent, {}, { ...baseFilters, agentResponsible: 'ana' }) === true, 'ASSERT FAIL: matchesFilters agentResponsible deveria ser case-insensitive e parcial');

  const propQuery = { ...propA, label: 'Casa dos Sonhos', address: { neighborhood: 'Capoeiras', street: 'Rua Alfa' } };
  console.assert(matchesFilters(propQuery, {}, { ...baseFilters, query: 'sonhos' }) === true, 'ASSERT FAIL: matchesFilters query deveria achar por apelido');
  console.assert(matchesFilters(propQuery, {}, { ...baseFilters, query: 'alfa' }) === true, 'ASSERT FAIL: matchesFilters query deveria achar por rua');
  console.assert(matchesFilters(propQuery, {}, { ...baseFilters, query: 'inexistente' }) === false, 'ASSERT FAIL: matchesFilters query não deveria achar termo ausente');

  const condosById = { condo1: { pool: true, gym: false } };
  const propB = { ...propA, condoId: 'condo1' };
  console.assert(matchesFilters(propB, condosById, { ...baseFilters, amenities: ['pool'] }) === true, 'ASSERT FAIL: matchesFilters deveria aceitar amenidade presente');
  console.assert(matchesFilters(propB, condosById, { ...baseFilters, amenities: ['gym'] }) === false, 'ASSERT FAIL: matchesFilters deveria rejeitar amenidade ausente');

  console.assert(UNIT_TYPES.every(t => typeof TYPE_ICONS[t] === 'string' && TYPE_ICONS[t].length > 0), 'ASSERT FAIL: TYPE_ICONS deveria ter ícone para todos os UNIT_TYPES');
  console.assert(new Set(UNIT_TYPES.map(t => TYPE_ICONS[t])).size === UNIT_TYPES.length, 'ASSERT FAIL: TYPE_ICONS deveria ter ícone distinto por tipo (achou duplicata)');

  console.log('[self-check] Lógica de negócio OK');
})();

let map, markersLayer;
const markersById = {};

function initMap() {
  map = L.map('map').setView(MAP_CENTER, MAP_ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);
  const satelliteLayer = L.tileLayer.wms('https://geofloripa.pmf.sc.gov.br/geoserver/Geoportal/ows', {
    layers: '201601MUN',
    format: 'image/png',
    transparent: true,
    version: '1.3.0',
    attribution: 'Ortomosaico 2016 &copy; IPUF/PMF Florianópolis',
    maxZoom: 19
  });
  L.control.layers(null, { 'Satélite (2016)': satelliteLayer }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

window.addEventListener('DOMContentLoaded', () => {
  initMap();
  // ponytail: Leaflet mede o container no momento do L.map(); se o layout
  // flex/vh ainda não assentou nesse instante, o mapa fica com escala/
  // proporção erradas até um resize manual. invalidateSize corrige.
  setTimeout(() => map.invalidateSize(), 50);
  window.addEventListener('resize', () => map.invalidateSize());
});

function buildMarkerIcon(status, unitType) {
  const color = STATUS_COLORS[status] || '#8b9bab';
  const typeIcon = TYPE_ICONS[unitType] || ICONS.house;
  const svg = `<svg width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 0C6.7 0 0 6.7 0 15c0 11 15 25 15 25s15-14 15-25C30 6.7 23.3 0 15 0z" fill="${color}"/>
      <circle cx="15" cy="15" r="10" fill="#04121f" fill-opacity=".25"/>
      <circle cx="15" cy="15" r="9" fill="#0f1720"/>
      <g transform="translate(7,7)" fill="${color}">${typeIcon}</g>
    </svg>`;
  return L.divIcon({
    className: 'property-pin',
    html: svg,
    iconSize: [30, 40],
    iconAnchor: [15, 40],
    popupAnchor: [0, -36]
  });
}

function upsertMarker(property) {
  const existing = markersById[property.id];
  if (existing) markersLayer.removeLayer(existing);
  const marker = L.marker(property.coordinates, { draggable: true, icon: buildMarkerIcon(property.status, property.unitType) });
  marker.bindPopup(() => buildPopupHtml(property));
  marker.on('dragend', async () => {
    const pos = marker.getLatLng();
    const previousCoordinates = property.coordinates;
    property.coordinates = [pos.lat, pos.lng];
    try {
      await dbPut('properties', property);
    } catch (err) {
      console.error(err);
      property.coordinates = previousCoordinates;
      marker.setLatLng(previousCoordinates);
      alert('Não foi possível salvar a nova posição do imóvel. A posição foi revertida.');
    }
  });
  marker.addTo(markersLayer);
  markersById[property.id] = marker;
}

function removeMarker(id) {
  const marker = markersById[id];
  if (marker) { markersLayer.removeLayer(marker); delete markersById[id]; }
}

async function deleteProperty(id) {
  if (!confirm('Excluir este imóvel?')) return false;
  await dbDelete('properties', id);
  appState.properties = appState.properties.filter(p => p.id !== id);
  removeMarker(id);
  window.dispatchEvent(new CustomEvent('properties-updated'));
  return true;
}

async function adjustAvailableUnits(id, delta) {
  const property = appState.properties.find(p => p.id === id);
  if (!property || !property.isLaunch) return;
  const next = Math.max(0, Math.min(property.totalUnits, property.availableUnits + delta));
  if (next === property.availableUnits) return;
  const previous = property.availableUnits;
  property.availableUnits = next;
  try {
    await dbPut('properties', property);
  } catch (err) {
    console.error(err);
    property.availableUnits = previous;
    alert('Não foi possível salvar o ajuste de unidades.');
    return;
  }
  const marker = markersById[id];
  if (marker && marker.isPopupOpen()) marker.setPopupContent(buildPopupHtml(property));
  window.dispatchEvent(new CustomEvent('properties-updated'));
}

async function loadAllProperties() {
  appState.condos = await dbGetAll('condos');
  appState.condosById = Object.fromEntries(appState.condos.map(c => [c.id, c]));
  appState.properties = await dbGetAll('properties');
  // ponytail: dbGetAll('properties') pode trazer um registro malformado
  // (import parcial, edição manual do IndexedDB) sem coordinates válidas,
  // que quebraria L.marker(undefined). Guarda evita abortar o forEach inteiro.
  appState.properties.forEach(p => { if (Array.isArray(p.coordinates)) upsertMarker(p); });
  refreshCondoSelect();
  window.dispatchEvent(new CustomEvent('properties-updated'));
}

window.addEventListener('DOMContentLoaded', () => {
  loadAllProperties().catch(err => {
    console.error(err);
    const message = window.indexedDB
      ? 'Não foi possível carregar os dados salvos. Veja o console para detalhes.'
      : 'Este navegador não suporta o armazenamento necessário (IndexedDB). Use um navegador atualizado (Chrome, Firefox, Edge).';

    document.body.prepend(banner);
  });
});

let geocodePreviewMarker = null;

function clearGeocodePreview() {
  if (geocodePreviewMarker) { markersLayer.removeLayer(geocodePreviewMarker); geocodePreviewMarker = null; }
}

async function geocodeAddress() {
  const street = $('f_street').value.trim();
  const number = $('f_number').value.trim();
  const neighborhood = $('f_neighborhood').value.trim();
  const city = $('f_city').value.trim() || 'Florianópolis';
  if (!street) { alert('Preencha ao menos a rua antes de localizar.'); return; }
  const query = [street, number, neighborhood, city, 'SC', 'Brasil'].filter(Boolean).join(', ');
  const btn = $('btnGeocodeAddress');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Buscando...';
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
    const res = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
    const results = await res.json();
    if (!results.length) {
      alert('Endereço não encontrado. Ajuste manualmente clicando no mapa.');
      return;
    }
    const lat = parseFloat(results[0].lat), lng = parseFloat(results[0].lon);
    $('f_lat').value = lat;
    $('f_lng').value = lng;
    map.flyTo([lat, lng], 17, { duration: 0.8 });
    clearGeocodePreview();
    geocodePreviewMarker = L.marker([lat, lng], { icon: buildMarkerIcon('disponivel', $('f_unitType').value) }).addTo(markersLayer);
  } catch (err) {
    console.error(err);
    alert('Erro ao buscar endereço. Tente novamente.');
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function handleCondoCreateIfNeeded() {
  const nameField = $('c_name');
  if ($('newCondoFields').style.display === 'none' || !nameField.value.trim()) return null;
  const condo = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    name: nameField.value.trim(),
    pool: $('c_pool').checked,
    gym: $('c_gym').checked,
    partyRoom: $('c_partyRoom').checked,
    playground: $('c_playground').checked,
    petArea: $('c_petArea').checked,
    security24h: $('c_security24h').checked,
    elevator: $('c_elevator').checked,
    gatedCommunity: $('c_gatedCommunity').checked,
    monthlyFee: Number($('c_monthlyFee').value) || 0
  };
  await dbPut('condos', condo);
  appState.condos.push(condo);
  appState.condosById[condo.id] = condo;
  refreshCondoSelect();
  return condo.id;
}

function refreshCondoSelect() {
  const select = $('f_condoId');
  const current = select.value;
  select.innerHTML = '<option value="">Nenhum</option>' +
    appState.condos.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  select.value = current;
}

async function savePropertyForm(event) {
  event.preventDefault();
  const property = readPropertyForm();
  const errors = validateProperty(property);
  const errorsEl = $('formErrors');
  if (errors.length) {
    errorsEl.innerHTML = errors.map(e => '• ' + e).join('<br>');
    errorsEl.classList.add('show');
    return;
  }
  errorsEl.classList.remove('show');
  const newCondoId = await handleCondoCreateIfNeeded();
  if (newCondoId) property.condoId = newCondoId;
  try {
    await dbPut('properties', property);
  } catch (err) {
    console.error(err);
    errorsEl.innerHTML = '• Não foi possível salvar o imóvel. Veja o console para detalhes.';
    errorsEl.classList.add('show');
    return;
  }
  const idx = appState.properties.findIndex(p => p.id === property.id);
  if (idx >= 0) appState.properties[idx] = property; else appState.properties.push(property);
  upsertMarker(property);
  window.dispatchEvent(new CustomEvent('properties-updated'));
  closePropertyForm();
}

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('propertyForm').classList.contains('open')) closePropertyForm();
  });
  $('btnNewCondo').addEventListener('click', () => {
    const el = $('newCondoFields');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  });
  $('f_isLaunch').addEventListener('change', () => {
    $('launchUnitsFields').style.display = $('f_isLaunch').checked ? 'block' : 'none';
  });
  $('btnAddProperty').addEventListener('click', () => {
    appState.addMode = !appState.addMode;
    $('btnAddProperty').classList.toggle('active', appState.addMode);
    $('map').classList.toggle('add-mode', appState.addMode);
  });
  map.on('click', (e) => {
    if (!appState.addMode) return;
    openPropertyForm([e.latlng.lat, e.latlng.lng], null);
    appState.addMode = false;
    $('btnAddProperty').classList.remove('active');
    $('map').classList.remove('add-mode');
  });
});

/* === SECTION: PHOTOS === */
let formPhotos = [];

function resizeImageToBlob(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Falha ao gerar imagem')), 'image/jpeg', 0.85);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPhotoThumbnails() {
  const wrap = $('photoThumbs');
  wrap.innerHTML = '';
  formPhotos.forEach((blob, idx) => {
    const url = URL.createObjectURL(blob);
    const thumb = document.createElement('div');
    thumb.style.cssText = 'position:relative;display:inline-block;margin:4px;';
    thumb.innerHTML = `<img src="${url}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;">
      <button type="button" data-idx="${idx}" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;padding:0;border-radius:50%;background:var(--warn-fg);color:#04121f;border:0;cursor:pointer;font-size:11px;line-height:1;">×</button>`;
    wrap.appendChild(thumb);
  });
  wrap.querySelectorAll('button[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      formPhotos.splice(Number(btn.dataset.idx), 1);
      renderPhotoThumbnails();
    });
  });
}

window.addEventListener('DOMContentLoaded', () => {
  $('f_photos').addEventListener('change', async (e) => {
    for (const file of e.target.files) {
      const blob = await resizeImageToBlob(file, 1600);
      formPhotos.push(blob);
    }
    renderPhotoThumbnails();
    e.target.value = '';
  });
});

/* === SECTION: FILTERS === */
function defaultFilters() {
  return {
    dealType: 'ambos', unitTypes: [], status: [],
    priceMin: null, priceMax: null,
    roomsMin: null, suitesMin: null, bathroomsMin: null, parkingMin: null,
    areaMin: null, areaMax: null,
    furnished: 'qualquer', petsAllowed: 'qualquer',
    neighborhood: '', agentResponsible: '', amenities: [], query: ''
  };
}

function filterApp() {
  return {
    filters: defaultFilters(),
    unitTypeOptions: UNIT_TYPES.map(v => ({ value: v, label: UNIT_TYPE_LABELS[v] })),
    statusOptions: STATUS_OPTIONS.map(v => ({ value: v, label: STATUS_LABELS[v] })),
    typeIcons: TYPE_ICONS,
    amenityOptions: Object.entries(AMENITY_LABELS).map(([value, label]) => ({ value, label })),
    init() {
      window.addEventListener('properties-updated', () => this.apply());
      this.apply();
    },
    apply() {
      const filtered = appState.properties.filter(p => matchesFilters(p, appState.condosById, this.filters));
      window.dispatchEvent(new CustomEvent('filters-applied', { detail: { filtered } }));
    },
    reset() {
      this.filters = defaultFilters();
      this.apply();
    }
  };
}

window.addEventListener('filters-applied', (e) => {
  $('resultCount').textContent = e.detail.filtered.length;
  const filteredIds = new Set(e.detail.filtered.map(p => p.id));
  Object.entries(markersById).forEach(([id, marker]) => {
    const shouldShow = filteredIds.has(id);
    const isShown = markersLayer.hasLayer(marker);
    if (shouldShow && !isShown) marker.addTo(markersLayer);
    if (!shouldShow && isShown) markersLayer.removeLayer(marker);
  });
});

/* === SECTION: LIST === */
function renderList(properties) {
  const wrap = $('listItems');
  wrap.innerHTML = properties.map(p => {
    const priceLabel = priceLabelFor(p);
    const addr = p.address || {};
    const statusColor = STATUS_COLORS[p.status] || '#8b9bab';
    const statusTextColor = STATUS_TEXT_COLORS[p.status] || '#5a6270';
    const photoUrl = p.photos && p.photos.length ? URL.createObjectURL(p.photos[0]) : null;
    const specs = [
      p.rooms ? `<span>${ICONS.bed}${p.rooms}</span>` : '',
      p.bathrooms ? `<span>${ICONS.bath}${p.bathrooms}</span>` : '',
      p.constructedArea ? `<span>${ICONS.area}${p.constructedArea}m²</span>` : ''
    ].join('');
    return `<div class="list-item" data-id="${p.id}">
      ${photoUrl ? `<img src="${photoUrl}" class="list-item-photo" onclick="event.stopPropagation(); openPropertyDetail('${p.id}')">` : `<div class="list-item-photo list-item-photo-empty" onclick="event.stopPropagation(); openPropertyDetail('${p.id}')">${TYPE_ICONS[p.unitType] || ICONS.house}</div>`}
      <div class="list-item-body">
        <div class="list-item-top">
          <strong onclick="event.stopPropagation(); openPropertyDetail('${p.id}')" style="cursor:pointer;">${priceLabel}</strong>
          <span class="list-item-status" style="background:${statusColor}22;color:${statusTextColor};">${STATUS_LABELS[p.status] || p.status}</span>
        </div>
        <div class="list-item-addr">${UNIT_TYPE_LABELS[p.unitType] || p.unitType} · ${addr.neighborhood || ''}</div>
        ${specs ? `<div class="list-item-specs">${specs}</div>` : ''}
        ${p.isLaunch ? `<div class="unit-stepper"><button type="button" onclick="event.stopPropagation(); adjustAvailableUnits('${p.id}', -1)">−</button><span>${p.availableUnits} de ${p.totalUnits}</span><button type="button" onclick="event.stopPropagation(); adjustAvailableUnits('${p.id}', 1)">+</button></div>` : ''}
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const marker = markersById[id];
      if (!marker) return;
      map.flyTo(marker.getLatLng(), 16, { duration: 0.6 });
      map.once('moveend', () => marker.openPopup());
    });
  });
}

window.addEventListener('filters-applied', (e) => renderList(e.detail.filtered));

/* === SECTION: BACKUP === */
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function base64ToBlob(dataUrl) {
  return fetch(dataUrl).then(r => r.blob());
}

async function exportBackup() {
  const properties = await dbGetAll('properties');
  const condos = await dbGetAll('condos');
  const propertiesOut = [];
  for (const p of properties) {
    const photos = [];
    for (const blob of (p.photos || [])) photos.push(await blobToBase64(blob));
    propertiesOut.push({ ...p, photos });
  }
  const payload = { version: 1, exportedAt: new Date().toISOString(), properties: propertiesOut, condos };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mapa-imoveis-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function importBackup(file) {
  let payload;
  try {
    const text = await file.text();
    payload = JSON.parse(text);
  } catch (err) {
    console.error(err);
    alert('Arquivo de backup inválido ou corrompido.');
    return;
  }
  if (!payload || !Array.isArray(payload.properties) || !Array.isArray(payload.condos)) {
    alert('Arquivo de backup em formato inesperado (faltam properties/condos).');
    return;
  }
  try {
    for (const condo of payload.condos) await dbPut('condos', condo);
    for (const p of payload.properties) {
      const photos = [];
      for (const dataUrl of (p.photos || [])) photos.push(await base64ToBlob(dataUrl));
      await dbPut('properties', { ...p, photos });
    }
    await loadAllProperties();
    alert('Importação concluída.');
  } catch (err) {
    console.error(err);
    alert('Erro ao importar backup — parte dos dados pode não ter sido restaurada. Veja o console.');
  }
}

window.addEventListener('DOMContentLoaded', () => {
  $('btnExport').addEventListener('click', exportBackup);
  $('btnImport').addEventListener('click', () => $('importFileInput').click());
  $('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importBackup(file);
    e.target.value = '';
  });
});

window.addEventListener('DOMContentLoaded', () => {
  const handle = $('sidebarResizeHandle');
  const sidebar = $('sidebar');
  let dragging = false;
  handle.addEventListener('mousedown', (e) => {
    dragging = true;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const newWidth = Math.min(600, Math.max(220, e.clientX));
    sidebar.style.width = newWidth + 'px';
    if (map) map.invalidateSize();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
  });

  $('btnCollapseSidebar').addEventListener('click', () => {
    const collapsed = $('sidebar').classList.toggle('collapsed');
    $('btnCollapseSidebar').classList.toggle('collapsed', collapsed);
    $('btnCollapseSidebar').title = collapsed ? 'Mostrar filtros' : 'Ocultar filtros';
    setTimeout(() => map.invalidateSize(), 210);
  });

  $('btnCollapseMapFilter').addEventListener('click', () => {
    const collapsed = $('mapFilterCard').classList.toggle('collapsed');
    $('btnCollapseMapFilter').classList.toggle('collapsed', collapsed);
    $('btnCollapseMapFilter').title = collapsed ? 'Mostrar filtros do mapa' : 'Ocultar filtros do mapa';
  });

  $('btnToggleList').addEventListener('click', () => {
    const hidden = $('listPanel').classList.toggle('hidden');
    $('btnToggleList').textContent = hidden ? 'Mostrar lista' : 'Ocultar lista';
    map.invalidateSize();
  });

  $('tabMap').addEventListener('click', () => {
    $('mapView').style.display = '';
    $('financingView').style.display = 'none';
    $('detailView').style.display = 'none';
    $('tabMap').classList.add('active');
    $('tabFinancing').classList.remove('active');
    map.invalidateSize();
  });
  $('tabFinancing').addEventListener('click', () => {
    $('mapView').style.display = 'none';
    $('financingView').style.display = 'flex';
    $('detailView').style.display = 'none';
    $('tabFinancing').classList.add('active');
    $('tabMap').classList.remove('active');
    if (!$('financingFrame').src) $('financingFrame').src = 'financiamento.html';
  });
  $('btnDetailBack').addEventListener('click', () => {
    $('detailView').style.display = 'none';
    $('mapView').style.display = '';
    map.invalidateSize();
  });
});
</script>
