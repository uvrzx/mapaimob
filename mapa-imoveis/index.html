<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Imóveis - Uso Interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1/dist/leaflet.css">
<style>
  :root {
    color-scheme: dark;
    --navy: #0C1527;
    --bg: #060D1C; --panel: #0C1527; --panel-2: #131E36; --line: #26324D;
    --text: #F4F0E9; --muted: #A3AEC4;
    --accent: #C2A375; --on-accent: #0A1020; --accent-text: #D4BC92; --accent-tint: rgba(194,163,117,.14);
    --ok-bg: #0e3a2a; --ok-fg: #15803d; --ok-text: #86efac; --ok-line: #1f6b4a;
    --warn-bg: #3d1521; --warn-fg: #b91c1c; --warn-text: #fca5a5; --warn-line: #7a2a3a;
    --mid-fg: #b45309;
    --shadow-soft: 0 12px 32px rgba(0,0,0,.45);
    --radius: 16px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
    --sans: 'Geist', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  button { -webkit-tap-highlight-color: transparent; user-select: none; transition: transform .1s ease; }
  button:active { transform: scale(.94); }
  ::placeholder { color: var(--muted); opacity: .85; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, .quick-search:focus {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4;
    display: flex;
  }
  .shell {
    width: 100vw; height: 100vh;
    background: radial-gradient(60% 45% at 0% 100%, rgba(194,163,117,.10), transparent 70%), radial-gradient(55% 45% at 100% 100%, rgba(32,72,140,.20), transparent 70%), var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 12px 20px;
    padding: 12px 24px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  header h1 { font-family: var(--serif); font-size: 24px; margin: 0; font-weight: 600; letter-spacing: .01em; white-space: nowrap; display: flex; align-items: center; gap: 10px; line-height: 1; }
  .brand-mark { width: 28px; height: 28px; border: 1px solid var(--accent); border-radius: 50%; color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; flex-shrink: 0; }
  .hdr-actions { display: flex; align-items: center; gap: 8px; }
  .quick-search {
    width: 100%; max-width: 640px; min-width: 0; justify-self: center; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 16px; border-radius: 999px; font-size: 13px;
  }
  header button {
    background: var(--accent); color: var(--on-accent); border: 0; padding: 8px 16px;
    border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13px; letter-spacing: .01em;
  }
  header button:hover { filter: brightness(1.08); }
  header button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  header button.active { background: var(--ok-fg); color: #fff; }
  #btnAddProperty.active { background: var(--ok-fg); color: #fff; }
  header button .ico { display: none; }
  .view-tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .view-tab { background: transparent; border: 0; color: var(--muted); padding: 7px 16px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .02em; cursor: pointer; }
  .view-tab.active { background: var(--accent); color: var(--on-accent); }
  #financingView { flex: 1; min-height: 0; display: none; }
  #financingFrame { width: 100%; height: 100%; border: 0; display: block; }
  #dashboardView { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 32px; }
  .dash-kpis { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .dash-kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; min-width: 120px; box-shadow: var(--shadow-soft); }
  .dash-kpi strong { display: block; font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: lining-nums; }
  .dash-kpi span { color: var(--muted); font-size: 12px; }
  .dash-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: start; }
  .dash-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow-soft); margin-bottom: 20px; }
  .dash-card h3 { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: .01em; margin: 0 0 14px; }
  .dash-period { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 12px; margin-bottom: 14px; }
  .dash-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .dash-bar-row span { width: 110px; flex-shrink: 0; color: var(--muted); }
  .dash-bar-row strong { width: 110px; flex-shrink: 0; text-align: right; }
  .dash-bar { flex: 1; height: 10px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
  .dash-bar-fill { height: 100%; border-radius: 6px; }
  .dash-bar-caption { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .dash-main button, .dash-side button { background: var(--accent); color: var(--on-accent); border: 0; padding: 7px 16px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 12px; }
  .dash-main button.ghost, .dash-side button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  .dash-featured-photo { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; fill: var(--muted); }
  .dash-featured-price { display: block; font-size: 18px; margin-top: 12px; }
  .dash-featured-specs { display: flex; gap: 10px; margin: 8px 0 14px; font-size: 12px; color: var(--text); flex-wrap: wrap; }
  .dash-featured-specs span { display: flex; align-items: center; gap: 4px; fill: var(--muted); }
  .dash-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dash-table th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .dash-table td { padding: 8px; border-bottom: 1px solid var(--line); }
  #detailView { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 28px 32px; }
  #detailView > button, .detail-main button { background: var(--accent); color: var(--on-accent); border: 0; padding: 9px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13px; }
  #detailView > button.ghost, .detail-main button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  #btnDetailBack { margin-bottom: 20px; }
  .detail-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: start; }
  .detail-title { font-family: var(--serif); font-size: 38px; font-weight: 600; line-height: 1.1; margin: 0 0 6px; }
  .detail-address { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .detail-price-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .detail-price { font-size: 22px; font-weight: 700; }
  .detail-specs { display: flex; gap: 20px; margin-bottom: 20px; font-size: 14px; color: var(--text); flex-wrap: wrap; }
  .detail-specs span { display: flex; align-items: center; gap: 6px; fill: var(--muted); }
  .detail-section { margin-top: 24px; }
  .detail-section h3 { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 0 0 10px; }
  #detailDescText { white-space: pre-line; }
  .detail-hero { width: 100%; height: 320px; object-fit: cover; border-radius: 16px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; fill: var(--muted); }
  .detail-thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .detail-thumbs img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; }
  .detail-amenities { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .detail-amenities span { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); fill: none; stroke: var(--accent-text); }
  .layout-body { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 320px; flex-shrink: 0; display: flex; flex-direction: column;
    overflow-y: auto; padding: 20px; border-right: 1px solid var(--line);
    scrollbar-width: thin;
    transition: width .2s ease, padding .2s ease;
  }
  @media (min-width: 900px) {
    #sidebar.collapsed { width: 0; min-width: 0; padding: 20px 0; overflow: hidden; border-right: 0; }
    #sidebar.collapsed > * { opacity: 0; pointer-events: none; }
  }
  .sidebar-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    position: sticky; top: -20px; z-index: 2; background: var(--bg);
    margin: -20px -20px 10px; padding: 16px 20px 10px; border-bottom: 1px solid var(--line);
  }
  .sidebar-head .reset-link { margin-left: auto; }
  .drawer-close { display: none; background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 2px; cursor: pointer; }
  .sidebar-head h2 { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: .01em; margin: 0; line-height: 1; }
  .reset-link { background: none; border: 0; color: var(--accent-text); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0; }
  #sidebarResizeHandle { width: 12px; flex-shrink: 0; cursor: col-resize; background: transparent; position: relative; }
  #sidebarResizeHandle:hover, #sidebarResizeHandle.dragging { background: linear-gradient(var(--accent), var(--accent)) 0 0 / 2px 100% no-repeat; }
  #btnCollapseSidebar {
    position: absolute; top: 16px; left: -1px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5;
    transition: transform .2s ease;
  }
  #btnCollapseSidebar:hover { border-color: var(--accent); color: var(--accent-text); }
  #btnCollapseSidebar.collapsed { transform: rotate(180deg); }
  #contentPanel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .content-head { padding: 16px 20px 0; font-size: 13px; color: var(--muted); font-weight: 700; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .content-head button { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; cursor: pointer; }
  .content-head button:hover { border-color: var(--accent); color: var(--text); }
  .content-row { flex: 1; min-height: 0; display: flex; }
  #listPanel.hidden { display: none; }
  #mapWrap {
    flex: 1; min-height: 0; position: relative; isolation: isolate;
    margin: 14px 20px 14px 14px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  }
  /* único trecho claro do app: mapa, HUD, legenda e popups herdam estes tokens */
  #mapWrap {
    color-scheme: light;
    --bg: #F1EDE6; --panel: #FBF9F5; --panel-2: #F1EDE6; --line: #E0D8CA;
    --text: #0C1527; --muted: #55607A;
    --accent: #0C1527; --on-accent: #F4F0E9; --accent-text: #765B2B; --accent-tint: rgba(118,91,43,.10);
    --shadow-soft: 0 1px 2px rgba(12,21,39,.06), 0 8px 24px rgba(12,21,39,.12);
  }
  #map { position: absolute; inset: 0; }
  #map.add-mode, #map.add-mode .leaflet-container { cursor: crosshair; }
  #map.form-open .leaflet-control-zoom { margin-right: 390px; transition: margin-right .25s cubic-bezier(.16,1,.3,1); }
  #mapHud { position: absolute; top: 14px; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100% - 28px); z-index: 1000; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow-soft); }
  #mapHud .seg-group { margin: 0; padding: 0; background: transparent; gap: 2px; }
  #mapHud .seg-group button { padding: 7px 16px; border-radius: 999px; white-space: nowrap; }
  #mapHud .seg-group button:not(.active):hover { background: var(--panel-2); color: var(--text); }
  #mapHud #btnHudFilter { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 6px 16px; border-radius: 999px; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
  #mapHud #btnHudFilter:hover { background: var(--panel-2); }
  #amenityBox { position: absolute; left: 14px; bottom: 14px; z-index: 1000; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; max-width: calc(100% - 28px); }
  #btnAmenityToggle { display: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-soft); }
  #amenityLegend { display: flex; flex-direction: column; gap: 2px; background: var(--panel); border-radius: 12px; padding: 8px; box-shadow: var(--shadow-soft); max-height: min(220px, 40vh); overflow-y: auto; }
  .amenity-legend-item { display: flex; align-items: center; gap: 6px; background: transparent; border: 0; color: var(--text); font-size: 11px; padding: 4px 6px; border-radius: 6px; cursor: pointer; text-align: left; }
  .amenity-legend-item:hover { background: var(--panel-2); }
  .amenity-legend-item.off { color: var(--muted); opacity: .5; }
  .amenity-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .leaflet-marker-draggable { cursor: grab !important; }
  .leaflet-marker-draggable:active, .leaflet-drag-target { cursor: grabbing !important; }
  #propertyForm {
    position: fixed; top: 0; right: 0; height: 100%; width: 380px; max-width: 100vw;
    background: var(--panel); border-left: 1px solid var(--line); z-index: 40;
    transform: translateX(100%); transition: transform .25s cubic-bezier(.16,1,.3,1);
    display: flex; flex-direction: column; padding: 18px 18px 0;
  }
  #propertyForm.open { transform: translateX(0); }
  #propertyForm h2 { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0 0 14px; flex-shrink: 0; }
  #propertyFormEl { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 4px; }
  .form-section { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .form-section:last-of-type { border-bottom: 0; }
  .form-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin: 0 0 4px; }
  #propertyForm label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #propertyForm input, #propertyForm select, #propertyForm textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 12px; border-radius: 12px; font-size: 14px;
  }
  #propertyForm input[type=checkbox] { width: auto; padding: 0; accent-color: var(--accent); }
  #propertyForm .row { display: flex; gap: 10px; }
  #propertyForm .row > * { flex: 1; }
  #formErrors { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-top: 10px; display: none; flex-shrink: 0; }
  #formErrors.show { display: block; }
  .btn-row { display: flex; gap: 10px; flex-shrink: 0; padding: 12px 0 18px; border-top: 1px solid var(--line); background: var(--panel); }
  #propertyForm button { background: var(--accent); color: var(--on-accent); border: 0; padding: 10px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13px; }
  #propertyForm button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  .btn-row button { flex: 1; }
  #filterPanel label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .4px; }
  #filterPanel .f { padding: 10px 0; border-top: 1px solid var(--line); }
  #filterPanel .f:first-child { border-top: 0; padding-top: 0; }
  #filterPanel .chip-group, #filterPanel .seg-group { margin: 0; }
  #filterPanel .chip { padding: 5px 10px; }
  details.adv { border-top: 1px solid var(--line); }
  details.adv > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 12px 0; font-size: 13px; font-weight: 700; }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
  details.adv[open] > summary::before { transform: rotate(90deg); }
  details.adv > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .adv-count { background: var(--accent); color: var(--on-accent); border-radius: 10px; font-size: 11px; min-width: 18px; padding: 1px 6px; text-align: center; }
  #filterPanel select, #filterPanel input[type=text], #filterPanel input[type=number] {
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:7px 10px; border-radius:12px; font-size:13px;
  }
  #filterPanel .row { display: flex; gap: 10px; }
  #filterPanel .row > * { flex: 1; }

  /* pin */
  .property-pin { animation: pin-pop .3s cubic-bezier(.34,1.56,.64,1); transform-origin: bottom center; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); transition: transform .12s ease; }
  .property-pin:hover { transform: scale(1.12) translateY(-2px); }
  @keyframes pin-pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* popup card */
  .leaflet-popup-content-wrapper { padding: 0; border-radius: 12px; overflow: hidden; background: var(--panel); color: var(--text); box-shadow: var(--shadow-soft); }
  .leaflet-popup-content { margin: 0; width: 260px !important; }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-close-button { color: var(--muted) !important; }
  .leaflet-bar a { background: var(--panel); color: var(--text); border-bottom-color: var(--line); }
  .leaflet-bar a:hover, .leaflet-bar a:focus { background: var(--panel-2); }
  .leaflet-control-layers, .leaflet-control-layers-expanded { background: var(--panel); color: var(--text); }
  .leaflet-container .leaflet-control-attribution { background: rgba(255,255,255,.85); color: var(--muted); }
  .leaflet-control-attribution a { color: var(--accent-text); }
  .leaflet-tooltip { background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow-soft); }
  .leaflet-tooltip::before { display: none; }
  .leaflet-container { background: var(--bg); }
  .property-popup-photo { width: 100%; height: 130px; object-fit: cover; display: block; background: var(--panel-2); }
  .property-popup-photo-empty { display: flex; align-items: center; justify-content: center; fill: var(--muted); }
  .property-popup-body { padding: 12px 14px; }
  .property-popup-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .property-popup-price { font-size: 17px; }
  .property-popup-status { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; letter-spacing: .4px; white-space: nowrap; }
  .property-popup-type { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .property-popup-addr { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.35; }
  .property-popup-specs { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--text); }
  .property-popup-specs span { display: flex; align-items: center; gap: 4px; fill: var(--muted); }
  .unit-stepper { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text); }
  .unit-stepper button { width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); cursor: pointer; font-weight: 700; line-height: 1; padding: 0; flex-shrink: 0; }
  .unit-stepper button:hover { border-color: var(--accent); color: var(--accent-text); }
  .property-popup-actions { display: flex; gap: 8px; margin-top: 12px; }
  .property-popup-actions button { flex: 1; padding: 8px 4px; font-size: 11px; border-radius: 999px; background: var(--accent); color: var(--on-accent); border: 0; cursor: pointer; font-weight: 700; white-space: nowrap; }
  .property-popup-actions button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }

  /* pin de condomínio */
  .condo-pin { position: relative; width: 52px; }
  .condo-pin-photo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 3px solid var(--panel); box-shadow: var(--shadow-soft); display: block; margin: 0 auto; }
  .condo-pin-photo-empty { display: flex; align-items: center; justify-content: center; background: var(--panel-2); fill: var(--muted); }
  .condo-pin-badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap; box-shadow: var(--shadow-soft); }

  /* cartão de prédio (popup) */
  .condo-popup-photo { width: 100%; height: 130px; object-fit: cover; display: block; background: var(--panel-2); }
  .condo-popup-photo-empty { display: flex; align-items: center; justify-content: center; fill: var(--muted); }
  .condo-popup-body { padding: 12px 14px; }
  .condo-popup-name { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.15; display: block; }
  .condo-popup-addr { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .condo-popup-gallery { position: relative; }
  .condo-popup-gallery-prev, .condo-popup-gallery-next { position: absolute; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: rgba(12,21,39,.7); color: #F4F0E9; border: 0; cursor: pointer; font-size: 14px; line-height: 1; }
  .condo-popup-gallery-prev { left: 8px; }
  .condo-popup-gallery-next { right: 8px; }
  .condo-popup-section { margin-top: 10px; }
  .condo-popup-section h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin: 0 0 6px; }
  .condo-popup-section p { font-size: 12px; color: var(--text); margin: 0; }
  .condo-popup-amenities { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .condo-popup-amenities span { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text); fill: none; stroke: var(--accent-text); }
  .condo-popup-units { display: flex; flex-direction: column; gap: 6px; }
  .condo-popup-unit { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
  .condo-popup-unit-info { display: flex; flex-direction: column; cursor: pointer; min-width: 0; }
  .condo-popup-unit-info:hover { color: var(--accent-text); }
  .condo-popup-unit span { color: var(--muted); }
  .condo-popup-unit-sim { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; min-width: 32px; height: 24px; padding: 0 9px; flex-shrink: 0; cursor: pointer; font-size: 10px; font-weight: 700; letter-spacing: .02em; line-height: 1; }
  .condo-popup-empty { font-size: 12px; color: var(--muted); margin: 0; }
  .condo-popup-agenciar { width: 100%; margin-top: 12px; background: var(--accent); color: var(--on-accent); border: 0; padding: 10px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13px; }

  /* chips / segmented controls (filtros) */
  .chip-group, .stepper-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 6px 14px; border-radius: 999px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .seg-group { display: flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; margin: 4px 0 2px; }
  .seg-group { position: relative; }
  .seg-group button {
    flex: 1; background: transparent; border: 0; color: var(--muted); padding: 7px 8px;
    border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: color .15s, background .2s cubic-bezier(.2,.8,.2,1);
  }
  .seg-group button.active { background: var(--accent); color: var(--on-accent); }

  /* lista de imóveis (coluna vertical rolável à esquerda do mapa) */
  #listPanel { flex-shrink: 0; width: 320px; order: -1; padding: 14px 0 18px 20px; overflow-y: auto; }
  #listItems { display: flex; flex-direction: column; gap: 14px; }
  .list-item {
    display: flex; flex-direction: column; width: 100%;
    border-radius: 14px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line);
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .list-item:hover { transform: translateY(-3px); border-color: var(--accent); }
  .list-item:active { transform: translateY(-1px) scale(.97); }
  .list-item-photo { width: 100%; height: 120px; object-fit: cover; flex-shrink: 0; background: var(--panel); }
  .list-item-photo-empty { display: flex; align-items: center; justify-content: center; fill: var(--muted); }
  .list-item-body { min-width: 0; padding: 10px 12px 12px; }
  .list-item-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .list-item-top strong { font-size: 13px; }
  .list-item-status { font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 10px; white-space: nowrap; }
  .list-item-addr { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item-specs { display: flex; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--text); }
  .list-item-specs span { display: flex; align-items: center; gap: 3px; fill: var(--muted); }

  .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .type-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 4px; font-size: 11px; color: var(--text); cursor: pointer; transition: all .15s; fill: var(--muted);
  }
  .type-btn:hover { border-color: var(--accent); }
  .type-btn.active { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-text); fill: var(--accent-text); font-weight: 600; }

  /* backdrop do formulário */
  #formBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(1px); z-index: 35; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  #formBackdrop.show { opacity: 1; pointer-events: auto; }

  /* backdrop da gaveta de filtros (<900px) */
  #drawerBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1190; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  #drawerBackdrop.show { opacity: 1; pointer-events: auto; }

  /* responsivo: ≥1200 layout cheio; 900–1199 sidebar menor e lista oculta (JS); <900 gavetas */
  @media (max-width: 1199px) {
    #sidebar { width: 280px; }
    header {
      grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand tabs" "search actions";
      padding: 10px 14px; gap: 8px 10px;
    }
    header h1 { grid-area: brand; }
    header .view-tabs { grid-area: tabs; justify-self: end; }
    header .quick-search { grid-area: search; max-width: none; justify-self: stretch; }
    header .hdr-actions { grid-area: actions; }
  }
  @media (max-width: 899px) {
    header button { padding: 7px 12px; }
    .view-tab { padding: 6px 12px; }
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 1200; width: min(320px, 88vw) !important; background: var(--panel);
      transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow-soft);
    }
    #sidebar.open { transform: none; }
    .drawer-close { display: block; }
    #sidebarResizeHandle { display: none; }
    .content-row { position: relative; }
    #mapWrap { margin: 8px; }
    #listPanel {
      position: absolute; top: 0; bottom: 0; left: 0; z-index: 1100; width: min(320px, 88vw);
      padding: 12px; background: var(--panel); border-right: 1px solid var(--line); box-shadow: var(--shadow-soft);
    }
    #mapHud { font-size: 12px; }
    #btnAmenityToggle { display: block; }
    #amenityBox:not(.open) #amenityLegend { display: none; }
    #dashboardView, #detailView { padding: 16px; }
    .dash-grid, .detail-grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .dash-bar-row span, .dash-bar-row strong { width: 80px; }
    #dashTableWrap { overflow-x: auto; }
  }
  @media (min-width: 900px) { #drawerBackdrop { display: none; } }
  @media (max-width: 599px) {
    #mapHud { left: 14px; right: auto; margin-inline: 0; max-width: calc(100% - 76px); }
    header { grid-template-areas: "tabs tabs" "search actions"; }
    header h1, header .lbl, .lbl-add, .lbl-long { display: none; }
    header .view-tabs { justify-self: stretch; }
    .view-tab { flex: 1; padding: 6px 9px; }
    header button .ico { display: inline; }
    header button.ghost { padding: 7px 10px; }
  }
</style>
</head>
<body>
<div class="shell" x-data="filterApp()" x-init="init()">
  <header>
    <h1><span class="brand-mark" aria-hidden="true">M</span><span class="h1-text">Mapa de Imóveis</span></h1>
    <div class="view-tabs">
      <button type="button" id="tabMap" class="view-tab active">Mapa</button>
      <button type="button" id="tabDashboard" class="view-tab">Painel de vendas</button>
      <button type="button" id="tabFinancing" class="view-tab">Financiamento</button>
    </div>
    <input id="quickSearch" class="quick-search" type="text" placeholder="Buscar por endereço, bairro ou apelido..." x-model="filters.query" @input="apply()">
    <div class="hdr-actions">
      <button id="btnExport" class="ghost" type="button" title="Exportar backup" aria-label="Exportar backup"><span class="ico" aria-hidden="true">↓</span><span class="lbl">Exportar</span></button>
      <button id="btnImport" class="ghost" type="button" title="Importar backup" aria-label="Importar backup"><span class="ico" aria-hidden="true">↑</span><span class="lbl">Importar</span></button>
      <button id="btnAddProperty" type="button" aria-label="Adicionar imóvel">+<span class="lbl-add"> Adicionar</span><span class="lbl-long"> imóvel</span></button>
    </div>
    <input id="importFileInput" type="file" accept="application/json" style="display:none">
  </header>
  <div id="dashboardView" style="display:none;">
    <div class="dash-kpis" id="dashKpis"></div>
    <div class="dash-grid">
      <div class="dash-main">
        <div id="dashSalesCard"></div>
        <div id="dashLaunchCard"></div>
        <div id="dashTableWrap"></div>
      </div>
      <div class="dash-side">
        <div id="dashFeatured"></div>
      </div>
    </div>
  </div>
  <div class="layout-body" id="mapView">
  <aside id="sidebar">
    <div class="sidebar-head">
      <h2>Filtros</h2>
      <button type="button" class="reset-link" @click="reset()">Limpar</button>
      <button type="button" class="drawer-close" id="btnDrawerClose" aria-label="Fechar filtros">×</button>
    </div>
    <div id="filterPanel">
      <div class="f">
        <label>Negócio</label>
        <div class="seg-group">
          <template x-for="opt in [{v:'ambos',l:'Ambos'},{v:'venda',l:'Comprar'},{v:'aluguel',l:'Alugar'}]" :key="opt.v">
            <button type="button" :class="{active: filters.dealType===opt.v}" @click="filters.dealType=opt.v; apply()" x-text="opt.l"></button>
          </template>
        </div>
      </div>
      <div class="f">
        <label>Tipo de imóvel</label>
        <div class="type-grid">
          <template x-for="ut in unitTypeOptions" :key="ut.value">
            <button type="button" class="type-btn" :class="{active: filters.unitTypes.includes(ut.value)}"
              @click="filters.unitTypes = filters.unitTypes.includes(ut.value) ? filters.unitTypes.filter(v => v !== ut.value) : [...filters.unitTypes, ut.value]; apply()">
              <span x-html="typeIcons[ut.value]"></span>
              <span x-text="ut.label"></span>
            </button>
          </template>
        </div>
      </div>
      <div class="f">
        <label>Status</label>
        <div class="chip-group">
          <template x-for="st in statusOptions" :key="st.value">
            <button type="button" class="chip" :class="{active: filters.status.includes(st.value)}" x-text="st.label"
              @click="filters.status = filters.status.includes(st.value) ? filters.status.filter(v => v !== st.value) : [...filters.status, st.value]; apply()"></button>
          </template>
        </div>
      </div>
      <div class="f">
        <label>Preço mín / máx</label>
        <div class="row">
          <input type="number" x-model.number="filters.priceMin" @input="apply()" placeholder="mín">
          <input type="number" x-model.number="filters.priceMax" @input="apply()" placeholder="máx">
        </div>
      </div>
      <div class="f">
        <label>Quartos mín</label>
        <div class="stepper-group">
          <button type="button" class="chip" :class="{active: filters.roomsMin===null}" @click="filters.roomsMin=null; apply()">Todos</button>
          <template x-for="n in [1,2,3,4]" :key="n">
            <button type="button" class="chip" :class="{active: filters.roomsMin===n}" @click="filters.roomsMin=n; apply()" x-text="n + (n===4?'+':'')"></button>
          </template>
        </div>
      </div>
      <details class="adv">
        <summary>Mais filtros <span class="adv-count" style="display:none" x-show="advancedFiltersActiveCount(filters) > 0" x-text="advancedFiltersActiveCount(filters)"></span></summary>
        <div class="f">
          <label>Banheiros mín</label>
          <div class="stepper-group">
            <button type="button" class="chip" :class="{active: filters.bathroomsMin===null}" @click="filters.bathroomsMin=null; apply()">Todos</button>
            <template x-for="n in [1,2,3,4]" :key="n">
              <button type="button" class="chip" :class="{active: filters.bathroomsMin===n}" @click="filters.bathroomsMin=n; apply()" x-text="n + (n===4?'+':'')"></button>
            </template>
          </div>
        </div>
        <div class="f">
          <label>Vagas mín</label>
          <div class="stepper-group">
            <button type="button" class="chip" :class="{active: filters.parkingMin===null}" @click="filters.parkingMin=null; apply()">Todas</button>
            <template x-for="n in [1,2,3,4]" :key="n">
              <button type="button" class="chip" :class="{active: filters.parkingMin===n}" @click="filters.parkingMin=n; apply()" x-text="n + (n===4?'+':'')"></button>
            </template>
          </div>
        </div>
        <div class="f">
          <label>Suítes mín</label>
          <input type="number" x-model.number="filters.suitesMin" @input="apply()">
        </div>
        <div class="f">
          <label>Área mín / máx (m²)</label>
          <div class="row">
            <input type="number" x-model.number="filters.areaMin" @input="apply()" placeholder="mín">
            <input type="number" x-model.number="filters.areaMax" @input="apply()" placeholder="máx">
          </div>
        </div>
        <div class="f">
          <label>Mobiliado</label>
          <div class="seg-group">
            <template x-for="opt in [{v:'qualquer',l:'Qualquer'},{v:'sim',l:'Sim'},{v:'não',l:'Não'},{v:'parcial',l:'Parcial'}]" :key="opt.v">
              <button type="button" :class="{active: filters.furnished===opt.v}" @click="filters.furnished=opt.v; apply()" x-text="opt.l"></button>
            </template>
          </div>
        </div>
        <div class="f">
          <label>Aceita pet</label>
          <div class="seg-group">
            <template x-for="opt in [{v:'qualquer',l:'Qualquer'},{v:'true',l:'Sim'},{v:'false',l:'Não'}]" :key="opt.v">
              <button type="button" :class="{active: filters.petsAllowed===opt.v}" @click="filters.petsAllowed=opt.v; apply()" x-text="opt.l"></button>
            </template>
          </div>
        </div>
        <div class="f">
          <label>Bairro</label>
          <input type="text" x-model="filters.neighborhood" @input="apply()">
        </div>
        <div class="f">
          <label>Corretor</label>
          <input type="text" x-model="filters.agentResponsible" @input="apply()">
        </div>
        <div class="f">
          <label>Amenidades do condomínio</label>
          <div class="chip-group">
            <template x-for="am in amenityOptions" :key="am.value">
              <button type="button" class="chip" :class="{active: filters.amenities.includes(am.value)}" x-text="am.label"
                @click="filters.amenities = filters.amenities.includes(am.value) ? filters.amenities.filter(v => v !== am.value) : [...filters.amenities, am.value]; apply()"></button>
            </template>
          </div>
        </div>
      </details>
    </div>
  </aside>
  <div id="sidebarResizeHandle">
    <button type="button" id="btnCollapseSidebar" title="Ocultar filtros">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <main id="contentPanel">
    <div class="content-head">
      <span><span id="resultCount">0</span> imóveis encontrados</span>
      <button type="button" id="btnToggleList" class="ghost">Ocultar lista</button>
    </div>
    <div class="content-row">
    <div id="mapWrap">
    <div id="map"></div>
    <div id="mapHud">
      <div class="seg-group" id="mapModeToggle">
        <button type="button" data-mode="unidade" class="active">Unidade</button>
        <button type="button" data-mode="condominio">Condomínio</button>
      </div>
      <button type="button" id="btnHudFilter">Filtrar</button>
    </div>
    <div id="amenityBox">
      <button type="button" id="btnAmenityToggle" aria-expanded="false">Amenidades</button>
      <div id="amenityLegend"></div>
    </div>
    </div>
    <div id="listPanel"><div id="listItems"></div></div>
    </div>
  </main>
  </div>
  <div id="financingView">
    <iframe id="financingFrame" title="Simulador de financiamento"></iframe>
  </div>
  <div id="detailView">
    <button type="button" id="btnDetailBack" class="ghost">← Voltar</button>
    <div class="detail-grid">
      <div class="detail-main">
        <h1 class="detail-title" id="detailTitle"></h1>
        <p class="detail-address" id="detailAddress"></p>
        <div class="detail-price-row">
          <span class="detail-price" id="detailPrice"></span>
          <span class="property-popup-status" id="detailStatus"></span>
          <button type="button" id="btnDetailEdit">Editar imóvel</button>
        </div>
        <div class="detail-specs" id="detailSpecs"></div>
        <div id="detailExtra"></div>
        <div id="detailFooter"></div>
      </div>
      <div class="detail-gallery" id="detailGallery"></div>
    </div>
  </div>
</div>
<div id="drawerBackdrop"></div>
<div id="formBackdrop"></div>
<div id="propertyForm">
  <h2 id="formTitle">Novo imóvel</h2>
  <form id="propertyFormEl">
    <input type="hidden" id="f_id">
    <input type="hidden" id="f_lat">
    <input type="hidden" id="f_lng">

    <div class="form-section">
      <div class="form-section-title">Básico</div>
      <label for="f_label">Apelido (opcional)</label>
      <input id="f_label" type="text" placeholder="Ex: Casa Capoeiras 296">

      <div class="row">
        <div>
          <label for="f_status">Status</label>
          <select id="f_status">
            <option value="disponivel">Disponível</option>
            <option value="reservado">Reservado</option>
            <option value="vendido">Vendido</option>
            <option value="alugado">Alugado</option>
          </select>
        </div>
        <div>
          <label for="f_dealType">Negócio</label>
          <select id="f_dealType">
            <option value="venda">Venda</option>
            <option value="aluguel">Aluguel</option>
            <option value="venda_e_aluguel">Venda e aluguel</option>
          </select>
        </div>
      </div>

      <label for="f_unitType">Tipo de imóvel</label>
      <select id="f_unitType">
        <option value="casa">Casa</option>
        <option value="apartamento">Apartamento</option>
        <option value="comercial">Comercial</option>
        <option value="terreno">Terreno</option>
        <option value="cobertura">Cobertura</option>
        <option value="sobrado">Sobrado</option>
      </select>

      <label><input type="checkbox" id="f_isLaunch"> É lançamento?</label>
      <div id="launchUnitsFields" style="display:none;">
        <div class="row">
          <div>
            <label for="f_totalUnits">Total de unidades</label>
            <input id="f_totalUnits" type="number" min="0" step="1">
          </div>
          <div>
            <label for="f_availableUnits">Disponíveis agora</label>
            <input id="f_availableUnits" type="number" min="0" step="1">
          </div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Preço e área</div>
      <div class="row">
        <div>
          <label for="f_salePrice">Preço de venda (R$)</label>
          <input id="f_salePrice" type="number" min="0" step="1000">
        </div>
        <div>
          <label for="f_rentPrice">Preço de aluguel (R$)</label>
          <input id="f_rentPrice" type="number" min="0" step="50">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="f_constructedArea">Área construída (m²)</label>
          <input id="f_constructedArea" type="number" min="0" step="0.01">
        </div>
        <div>
          <label for="f_landArea">Área do lote (m²)</label>
          <input id="f_landArea" type="number" min="0" step="0.01">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Características</div>
      <div class="row">
        <div>
          <label for="f_rooms">Quartos</label>
          <input id="f_rooms" type="number" min="0" step="1">
        </div>
        <div>
          <label for="f_suites">Suítes</label>
          <input id="f_suites" type="number" min="0" step="1">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="f_bathrooms">Banheiros</label>
          <input id="f_bathrooms" type="number" min="0" step="1">
        </div>
        <div>
          <label for="f_parkingSpaces">Vagas</label>
          <input id="f_parkingSpaces" type="number" min="0" step="1">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="f_floor">Andar</label>
          <input id="f_floor" type="number" step="1">
        </div>
        <div>
          <label for="f_furnished">Mobiliado</label>
          <select id="f_furnished">
            <option value="não">Não</option>
            <option value="sim">Sim</option>
            <option value="parcial">Parcial</option>
          </select>
        </div>
      </div>

      <label for="f_petsAllowed">Aceita pet</label>
      <select id="f_petsAllowed">
        <option value="false">Não</option>
        <option value="true">Sim</option>
      </select>
    </div>

/* === SECTION: INDEXEDDB === */
const DB_NAME = 'mapaImoveisDB';
const DB_VERSION = 2;
let dbInstance = null;

function dbOpen() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    if (!window.indexedDB) return reject(new Error('IndexedDB não suportado neste navegador.'));
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('properties')) db.createObjectStore('properties', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('condos')) db.createObjectStore('condos', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('_selfcheck')) db.createObjectStore('_selfcheck', { keyPath: 'id' });
      if (e.oldVersion < 2) {
        // migração: versões antigas gravavam o registro de self-check direto em 'properties'
        e.target.transaction.objectStore('properties').delete('__selfcheck__');
      }
    };
    req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbPut(storeName, record) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(record);
    tx.oncomplete = () => resolve(record);
    tx.onerror = (e) => reject(e.target.error);
  });
}

async function dbGet(storeName, id) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbGetAll(storeName) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbDelete(storeName, id) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function formatCurrency(value) {
  if (value == null || isNaN(value)) return 'R$ 0,00';
  return 'R$ ' + Number(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function priceLabelFor(property) {
  const price = property.dealType === 'aluguel' ? property.rentPrice : property.salePrice;
  return property.dealType === 'aluguel' ? formatCurrency(price) + '/mês' : formatCurrency(price);
}

function validateProperty(property) {
  const errors = [];
  if (!property.unitType) errors.push('Tipo de imóvel é obrigatório.');
  if (!property.dealType) errors.push('Negócio (venda/aluguel) é obrigatório.');
  if (property.dealType !== 'aluguel' && !(property.salePrice > 0)) errors.push('Preço de venda é obrigatório.');
  if (property.dealType !== 'venda' && !(property.rentPrice > 0)) errors.push('Preço de aluguel é obrigatório.');
  if (!property.address || !property.address.street) errors.push('Endereço é obrigatório.');
  if (!Array.isArray(property.coordinates) || property.coordinates.length !== 2) errors.push('Coordenadas são obrigatórias (clique no mapa).');
  if (property.isLaunch && !(property.totalUnits > 0)) errors.push('Lançamento precisa de total de unidades maior que zero.');
  if (property.isLaunch && (property.availableUnits < 0 || property.availableUnits > property.totalUnits)) errors.push('Unidades disponíveis deve estar entre 0 e o total.');
  return errors;
}

function matchesFilters(property, condosById, filters) {
  if (filters.dealType !== 'ambos' && property.dealType !== 'venda_e_aluguel' && property.dealType !== filters.dealType) return false;
  if (filters.unitTypes.length && !filters.unitTypes.includes(property.unitType)) return false;
  if (filters.status.length && !filters.status.includes(property.status)) return false;
  if (filters.priceMin != null || filters.priceMax != null) {
    const inRange = (price) => price > 0 && (filters.priceMin == null || price >= filters.priceMin) && (filters.priceMax == null || price <= filters.priceMax);
    const relevantPrices = filters.dealType === 'aluguel' ? [property.rentPrice]
      : filters.dealType === 'venda' ? [property.salePrice]
      : [property.salePrice, property.rentPrice];
    if (!relevantPrices.some(inRange)) return false;
  }
  if (filters.roomsMin != null && (property.rooms || 0) < filters.roomsMin) return false;
  if (filters.suitesMin != null && (property.suites || 0) < filters.suitesMin) return false;
  if (filters.bathroomsMin != null && (property.bathrooms || 0) < filters.bathroomsMin) return false;
  if (filters.parkingMin != null && (property.parkingSpaces || 0) < filters.parkingMin) return false;
  if (filters.areaMin != null && (property.constructedArea || 0) < filters.areaMin) return false;
  if (filters.areaMax != null && (property.constructedArea || 0) > filters.areaMax) return false;
  if (filters.furnished !== 'qualquer' && property.furnished !== filters.furnished) return false;
  if (filters.petsAllowed !== 'qualquer' && String(property.petsAllowed) !== filters.petsAllowed) return false;
  if (filters.neighborhood && !(property.address.neighborhood || '').toLowerCase().includes(filters.neighborhood.toLowerCase())) return false;
  if (filters.agentResponsible && !(property.agentResponsible || '').toLowerCase().includes(filters.agentResponsible.toLowerCase())) return false;
  if (filters.query) {
    const q = filters.query.toLowerCase();
    const addr = property.address || {};
    const haystack = [property.label, addr.street, addr.neighborhood].filter(Boolean).join(' ').toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  if (filters.amenities.length) {
    const condo = property.condoId ? condosById[property.condoId] : null;
    if (!condo) return false;
    for (const amenity of filters.amenities) if (!condo[amenity]) return false;
  }
  return true;
}

let lastPoiBounds = null;
let poiFetchTimer = null;

function initPoiLayers() {
  AMENITY_POI_CATEGORIES.forEach(c => { poiLayersByCategory[c.key] = L.layerGroup().addTo(map); });
}

function buildPoiQuery(bbox) {
  const clauses = AMENITY_POI_CATEGORIES.map(c =>
    `node["${c.osmKey}"="${c.osmValue}"](${bbox});way["${c.osmKey}"="${c.osmValue}"](${bbox});`
  ).join('');
  return `[out:json][timeout:25];(${clauses});out center tags;`;
}

function categoryForTags(tags) {
  return AMENITY_POI_CATEGORIES.find(c => tags && tags[c.osmKey] === c.osmValue) || null;
}

function clearPoiLayers() {
  AMENITY_POI_CATEGORIES.forEach(c => poiLayersByCategory[c.key].clearLayers());
}

function renderPoiElements(elements) {
  clearPoiLayers();
  elements.forEach(el => {
    const cat = categoryForTags(el.tags);
    if (!cat) return;
    const lat = el.lat ?? (el.center && el.center.lat);
    const lon = el.lon ?? (el.center && el.center.lon);
    if (lat == null || lon == null) return;
    const marker = L.circleMarker([lat, lon], { radius: 6, color: '#fff', weight: 2, fillColor: cat.color, fillOpacity: 1 });
    if (el.tags.name) marker.bindTooltip(escapeHtml(el.tags.name));
    marker.addTo(poiLayersByCategory[cat.key]);
  });
}

async function fetchAndRenderPois() {
  if (map.getZoom() < POI_MIN_ZOOM) { clearPoiLayers(); return; }
  const bounds = map.getBounds();
  if (lastPoiBounds && lastPoiBounds.contains(bounds)) return;
  const padded = bounds.pad(0.3);
  const bbox = `${padded.getSouth()},${padded.getWest()},${padded.getNorth()},${padded.getEast()}`;
  try {
    const res = await fetch(POI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(buildPoiQuery(bbox))
    });
    if (!res.ok) throw new Error('Overpass HTTP ' + res.status);
    const data = await res.json();
    renderPoiElements(data.elements || []);
    lastPoiBounds = padded;
  } catch (err) {
    console.error('[POI] falha ao buscar amenidades', err);
  }
}

function renderAmenityLegend() {
  $('amenityLegend').innerHTML = AMENITY_POI_CATEGORIES.map(c => `

      <span class="amenity-legend-dot" style="background:${c.color};"></span>${c.label}

}

function togglePoiCategory(key) {
  poiEnabled[key] = !poiEnabled[key];
  const layer = poiLayersByCategory[key];
  if (poiEnabled[key]) layer.addTo(map); else layer.remove();
}

  setTimeout(() => map.invalidateSize(), 50);

function buildMarkerIcon(status, unitType) {
  const color = STATUS_COLORS[status] || '#8b9bab';
  const typeIcon = TYPE_ICONS[unitType] || ICONS.house;
  const svg = `<svg width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 0C6.7 0 0 6.7 0 15c0 11 15 25 15 25s15-14 15-25C30 6.7 23.3 0 15 0z" fill="${color}"/>
      <circle cx="15" cy="15" r="10" fill="#04121f" fill-opacity=".25"/>
      <circle cx="15" cy="15" r="9" fill="#0f1720"/>
      <g transform="translate(7,7)" fill="${color}">${typeIcon}</g>
    </svg>`;
  return L.divIcon({
    className: 'property-pin',
    html: svg,
    iconSize: [30, 40],
    iconAnchor: [15, 40],
    popupAnchor: [0, -36]
  });
}

function condoFillPercent(condoId, properties) {
  const linked = properties.filter(p => p.condoId === condoId);
  if (!linked.length) return null;
  const filled = linked.filter(p => p.status === 'vendido' || p.status === 'alugado').length;
  return Math.round((filled / linked.length) * 100);
}

function fillBadgeColor(pct) {
  if (pct < 34) return 'var(--warn-fg)';
  if (pct < 67) return 'var(--mid-fg)';
  return 'var(--ok-fg)';
}

function condoMatchesFilters(condo, filters) {
  if (filters.neighborhood && !((condo.address && condo.address.neighborhood) || '').toLowerCase().includes(filters.neighborhood.toLowerCase())) return false;
  if (filters.amenities.length) {
    for (const amenity of filters.amenities) if (!condo[amenity]) return false;
  }
  if (filters.query) {
    const q = filters.query.toLowerCase();
    const addr = condo.address || {};
    const haystack = [condo.name, addr.street, addr.neighborhood].filter(Boolean).join(' ').toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

function buildCondoMarkerIcon(condo, pct) {
  const photoUrl = condo.photos && condo.photos.length ? URL.createObjectURL(condo.photos[0]) : null;
  const badgeColor = fillBadgeColor(pct);
  const photoHtml = photoUrl
    ? `<img src="${photoUrl}" class="condo-pin-photo">`
    : `<div class="condo-pin-photo condo-pin-photo-empty">${ICONS.building}</div>`;
  const html = `<div class="condo-pin">
      <span class="condo-pin-badge" style="background:${badgeColor};">${pct}%</span>
      ${photoHtml}
    </div>`;
  return L.divIcon({ className: 'condo-pin-wrap', html, iconSize: [52, 64], iconAnchor: [26, 60], popupAnchor: [0, -56] });
}

function buildCondoPopupHtml(condo) {
  const addr = condo.address || {};

  const activeAmenities = Object.keys(AMENITY_LABELS).filter(k => condo[k]);
  const units = appState.properties.filter(p => p.condoId === condo.id);
  const galleryHtml = photoUrls.length
    ? `<div class="condo-popup-gallery" data-idx="0">
        <img src="${photoUrls[0]}" class="condo-popup-photo">
        ${photoUrls.length > 1 ? `
          <button type="button" class="condo-popup-gallery-prev" onclick="condoGalleryStep(this, -1)">‹</button>
          <button type="button" class="condo-popup-gallery-next" onclick="condoGalleryStep(this, 1)">›</button>` : ''}
      </div>`
    : `<div class="condo-popup-photo condo-popup-photo-empty">${ICONS.building}</div>`;
  const amenitiesHtml = activeAmenities.length
    ? `<div class="condo-popup-section"><h4>Condomínio</h4><div class="condo-popup-amenities">${activeAmenities.map(k => `<span>${AMENITY_CHECK_ICON}${AMENITY_LABELS[k]}</span>`).join('')}</div></div>`
    : '';
  const unitsHtml = `<div class="condo-popup-section"><h4>Unidades agenciadas</h4>${
    units.length
      ? `<div class="condo-popup-units">${units.map(u => `
          <div class="condo-popup-unit">
            <div class="condo-popup-unit-info" onclick="openPropertyDetail('${u.id}')">
              <strong>${priceLabelFor(u)}</strong>
              <span>${UNIT_TYPE_LABELS[u.unitType] || u.unitType}${u.rooms ? ' · ' + u.rooms + 'q' : ''}</span>
            </div>
            <button type="button" class="condo-popup-unit-sim" onclick="event.stopPropagation(); simulateFinancingFor('${u.id}')" title="Simular financiamento" aria-label="Simular financiamento">R$</button>
          </div>`).join('')}</div>`
      : `<p class="condo-popup-empty">Nenhuma unidade agenciada neste prédio.</p>`
  }</div>`;
  return `
    <div class="condo-popup" data-condo-id="${condo.id}">
      ${galleryHtml}
      <div class="condo-popup-body">
        <strong class="condo-popup-name">${escapeHtml(condo.name)}</strong>
        <div class="condo-popup-addr">${escapeHtml(addr.street || '')} ${escapeHtml(addr.number || '')}, ${escapeHtml(addr.neighborhood || '')}</div>
        ${condo.description ? `<div class="condo-popup-section"><h4>Sobre o prédio</h4><p>${escapeHtml(condo.description)}</p></div>` : ''}

        <button type="button" class="condo-popup-agenciar" onclick="registerAgencyRequest('${condo.id}')">Agenciar</button>

}

function condoGalleryStep(btn, delta) {
  const wrap = btn.closest('.condo-popup-gallery');
  const popup = btn.closest('.condo-popup');
  const condo = appState.condosById[popup.dataset.condoId];
  const photoUrls = (condo.photos || []).map(b => URL.createObjectURL(b));
  let idx = Number(wrap.dataset.idx);
  idx = (idx + delta + photoUrls.length) % photoUrls.length;
  wrap.dataset.idx = idx;
  wrap.querySelector('img').src = photoUrls[idx];
}

async function registerAgencyRequest(condoId) {
  const condo = appState.condosById[condoId];
  if (!condo) return;
  const previousAgencyRequestedAt = condo.agencyRequestedAt;
  condo.agencyRequestedAt = Date.now();
  try {
    await dbPut('condos', condo);
    alert('Agenciamento registrado para ' + condo.name + '.');
  } catch (err) {
    condo.agencyRequestedAt = previousAgencyRequestedAt;
    console.error(err);
    alert('Não foi possível registrar o agenciamento.');
  }
}

function upsertCondoMarker(condo) {
  const pct = condoFillPercent(condo.id, appState.properties);
  if (pct === null || !Array.isArray(condo.coordinates)) { removeCondoMarker(condo.id); return; }
  const existing = condoMarkersById[condo.id];
  if (existing) condoMarkersLayer.removeLayer(existing);
  const marker = L.marker(condo.coordinates, { icon: buildCondoMarkerIcon(condo, pct) });
  marker.bindPopup(() => buildCondoPopupHtml(condo));
  marker.addTo(condoMarkersLayer);
  condoMarkersById[condo.id] = marker;
}

function removeCondoMarker(id) {
  const marker = condoMarkersById[id];
  if (marker) { condoMarkersLayer.removeLayer(marker); delete condoMarkersById[id]; }
}

function renderCondoMarkers() {
  appState.condos.forEach(condo => {
    if (!condoMatchesFilters(condo, lastFilters)) { removeCondoMarker(condo.id); return; }
    upsertCondoMarker(condo);
  });
}

function salesBalanceFor(days) {
  const since = Date.now() - days * 86400000;
  const sold = appState.properties.filter(p => p.status === 'vendido' && p.updatedAt >= since);
  const rented = appState.properties.filter(p => p.status === 'alugado' && p.updatedAt >= since);
  const soldTotal = sold.reduce((sum, p) => sum + (p.salePrice || 0), 0);
  const rentedTotal = rented.reduce((sum, p) => sum + (p.rentPrice || 0), 0);
  return { soldCount: sold.length, soldTotal, rentedCount: rented.length, rentedTotal };
}

let dashSalesPeriodDays = 30;

function renderSalesCard(days) {
  dashSalesPeriodDays = days;
  const { soldCount, soldTotal, rentedCount, rentedTotal } = salesBalanceFor(days);
  const maxVal = Math.max(soldTotal, rentedTotal, 1);
  const soldPct = Math.round((soldTotal / maxVal) * 100);
  const rentedPct = Math.round((rentedTotal / maxVal) * 100);
  $('dashSalesCard').innerHTML = `
    <div class="dash-card">
      <h3>Balanço de vendas</h3>
      <select id="dashPeriod" class="dash-period">
        <option value="30" ${days === 30 ? 'selected' : ''}>Mensal</option>
        <option value="90" ${days === 90 ? 'selected' : ''}>Trimestral</option>
        <option value="180" ${days === 180 ? 'selected' : ''}>Semestral</option>
        <option value="365" ${days === 365 ? 'selected' : ''}>Anual</option>
      </select>
      <div class="dash-bar-row"><span>Vendido (${soldCount})</span><div class="dash-bar"><div class="dash-bar-fill" style="width:${soldPct}%;background:var(--accent);"></div></div><strong>${formatCurrency(soldTotal)}</strong></div>
      <div class="dash-bar-row"><span>Alugado (${rentedCount})</span><div class="dash-bar"><div class="dash-bar-fill" style="width:${rentedPct}%;background:var(--ok-fg);"></div></div><strong>${formatCurrency(rentedTotal)}</strong></div>
    </div>`;
  $('dashPeriod').addEventListener('change', (e) => renderSalesCard(Number(e.target.value)));
}

function renderLaunchCard() {
  const launches = appState.properties.filter(p => p.isLaunch);
  if (!launches.length) { $('dashLaunchCard').innerHTML = ''; return; }
  const totalUnits = launches.reduce((s, p) => s + (p.totalUnits || 0), 0);
  const availableUnits = launches.reduce((s, p) => s + (p.availableUnits || 0), 0);
  const soldUnits = totalUnits - availableUnits;
  const pct = totalUnits > 0 ? Math.round((soldUnits / totalUnits) * 100) : 0;
  $('dashLaunchCard').innerHTML = `
    <div class="dash-card">
      <h3>Unidades de lançamento</h3>
      <p>${availableUnits} de ${totalUnits} disponíveis em ${launches.length} lançamento${launches.length > 1 ? 's' : ''}</p>
      <div class="dash-bar"><div class="dash-bar-fill" style="width:${pct}%;background:var(--accent);"></div></div>
      <span class="dash-bar-caption">${soldUnits} unidades vendidas (${pct}%)</span>
    </div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function upsertMarker(property) {
  const existing = markersById[property.id];
  if (existing) markersLayer.removeLayer(existing);
  const marker = L.marker(property.coordinates, { draggable: true, icon: buildMarkerIcon(property.status, property.unitType) });
  marker.bindPopup(() => buildPopupHtml(property));
  marker.on('dragend', async () => {
    const pos = marker.getLatLng();
    const previousCoordinates = property.coordinates;
    property.coordinates = [pos.lat, pos.lng];
    try {
      await dbPut('properties', property);
    } catch (err) {
      console.error(err);
      property.coordinates = previousCoordinates;
      marker.setLatLng(previousCoordinates);
      alert('Não foi possível salvar a nova posição do imóvel. A posição foi revertida.');
    }
  });
  marker.addTo(markersLayer);
  markersById[property.id] = marker;
}

function removeMarker(id) {
  const marker = markersById[id];
  if (marker) { markersLayer.removeLayer(marker); delete markersById[id]; }
}

async function deleteProperty(id) {
  if (!confirm('Excluir este imóvel?')) return false;
  await dbDelete('properties', id);
  appState.properties = appState.properties.filter(p => p.id !== id);
  removeMarker(id);
  window.dispatchEvent(new CustomEvent('properties-updated'));
  return true;
}

async function adjustAvailableUnits(id, delta) {
  const property = appState.properties.find(p => p.id === id);
  if (!property || !property.isLaunch) return;
  const next = Math.max(0, Math.min(property.totalUnits, property.availableUnits + delta));
  if (next === property.availableUnits) return;
  const previous = property.availableUnits;
  property.availableUnits = next;
  try {
    await dbPut('properties', property);
  } catch (err) {
    console.error(err);
    property.availableUnits = previous;
    alert('Não foi possível salvar o ajuste de unidades.');
    return;
  }
  const marker = markersById[id];
  if (marker && marker.isPopupOpen()) marker.setPopupContent(buildPopupHtml(property));
  window.dispatchEvent(new CustomEvent('properties-updated'));
}

async function loadAllProperties() {
  appState.condos = await dbGetAll('condos');
  appState.condosById = Object.fromEntries(appState.condos.map(c => [c.id, c]));
  appState.properties = await dbGetAll('properties');
  // ponytail: dbGetAll('properties') pode trazer um registro malformado
  // (import parcial, edição manual do IndexedDB) sem coordinates válidas,
  // que quebraria L.marker(undefined). Guarda evita abortar o forEach inteiro.
  appState.properties.forEach(p => { if (Array.isArray(p.coordinates)) upsertMarker(p); });
  refreshCondoSelect();
  window.dispatchEvent(new CustomEvent('properties-updated'));
}

const GEOCODE_CONFIG = {
  f: { btn: 'btnGeocodeAddress', preview: true },
  c: { btn: 'btnGeocodeCondo', preview: false }
};

async function geocodeAddress(prefix) {
  const street = $(`${prefix}_street`).value.trim();
  const number = $(`${prefix}_number`).value.trim();
  const neighborhood = $(`${prefix}_neighborhood`).value.trim();
  const city = $(`${prefix}_city`).value.trim() || 'Florianópolis';
  if (!street) { alert('Preencha ao menos a rua antes de localizar.'); return; }
  const query = [street, number, neighborhood, city, 'SC', 'Brasil'].filter(Boolean).join(', ');
  const { btn: btnId, preview } = GEOCODE_CONFIG[prefix];
  const btn = $(btnId);
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Buscando...';
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
    const res = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
    const results = await res.json();
    if (!results.length) {
      alert(prefix === 'c'
        ? 'Endereço não encontrado. O condomínio será salvo com a localização do imóvel vinculado.'
        : 'Endereço não encontrado. Ajuste manualmente clicando no mapa.');
      return;
    }
    const lat = parseFloat(results[0].lat), lng = parseFloat(results[0].lon);
    $(`${prefix}_lat`).value = lat;
    $(`${prefix}_lng`).value = lng;
    map.flyTo([lat, lng], 17, { duration: 0.8 });
    clearGeocodePreview();
    if (preview) geocodePreviewMarker = L.marker([lat, lng], { icon: buildMarkerIcon('disponivel', $('f_unitType').value) }).addTo(markersLayer);
  } catch (err) {
    console.error(err);
    alert('Erro ao buscar endereço. Tente novamente.');
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function resizeImageToBlob(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Falha ao gerar imagem')), 'image/jpeg', 0.85);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPhotoThumbnails(photos, wrapId, onRemove) {
  const wrap = $(wrapId);
  wrap.innerHTML = '';
  photos.forEach((blob, idx) => {
    const url = URL.createObjectURL(blob);
    const thumb = document.createElement('div');
    thumb.style.cssText = 'position:relative;display:inline-block;margin:4px;';
    thumb.innerHTML = `<img src="${url}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;">
      <button type="button" data-idx="${idx}" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;padding:0;border-radius:50%;background:var(--warn-fg);color:#fff;border:0;cursor:pointer;font-size:11px;line-height:1;">×</button>`;
    wrap.appendChild(thumb);
  });
  wrap.querySelectorAll('button[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => onRemove(Number(btn.dataset.idx)));
  });
}

function renderFormPhotoThumbs() {
  renderPhotoThumbnails(formPhotos, 'photoThumbs', (idx) => { formPhotos.splice(idx, 1); renderFormPhotoThumbs(); });
}

function renderCondoPhotoThumbs() {

}

function defaultFilters() {

}

function filterApp() {
  return {
    filters: defaultFilters(),
    unitTypeOptions: UNIT_TYPES.map(v => ({ value: v, label: UNIT_TYPE_LABELS[v] })),
    statusOptions: STATUS_OPTIONS.map(v => ({ value: v, label: STATUS_LABELS[v] })),
    typeIcons: TYPE_ICONS,
    amenityOptions: Object.entries(AMENITY_LABELS).map(([value, label]) => ({ value, label })),
    init() {
      window.addEventListener('properties-updated', () => this.apply());
      this.apply();
    },
    apply() {
      const filtered = appState.properties.filter(p => matchesFilters(p, appState.condosById, this.filters));
      window.dispatchEvent(new CustomEvent('filters-applied', { detail: { filtered, filters: this.filters } }));
    },
    reset() {
      this.filters = defaultFilters();
      this.apply();
    }
  };
}

// Filtros que ficam atrás de "Mais filtros"; o badge no <summary> evita filtro oculto ativo sem aviso.
function advancedFiltersActiveCount(f) {
  const set = (v) => v != null && v !== '';
  return [
    set(f.bathroomsMin), set(f.parkingMin), set(f.suitesMin), set(f.areaMin) || set(f.areaMax),
    f.furnished !== 'qualquer', f.petsAllowed !== 'qualquer',
    f.neighborhood.trim() !== '', f.agentResponsible.trim() !== '', f.amenities.length > 0
  ].filter(Boolean).length;
}

(function selfCheckAdvancedFilters() {
  console.assert(advancedFiltersActiveCount(defaultFilters()) === 0, 'ASSERT FAIL: advancedFiltersActiveCount deveria ser 0 sem filtros');
  console.assert(advancedFiltersActiveCount({ ...defaultFilters(), bathroomsMin: 2, areaMax: 90, areaMin: 50, amenities: ['pool', 'gym'], neighborhood: ' ', priceMin: 1 }) === 3, 'ASSERT FAIL: advancedFiltersActiveCount deveria contar banheiros+área+amenidades e ignorar básicos/vazios');
  console.log('[self-check] Filtros avançados OK');
